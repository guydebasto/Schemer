<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schemer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-dark:#0F241D;
    --board:#1B4332;
    --board-line:#2F5C4C;
    --chalk:#F4F1E8;
    --chalk-dim:#B9C7BE;
    --gold:#E8C468;
    --gold-dim:#8a7a49;
    --brick:#C1503F;
    --brick-dim:#7a3931;
    --hash:#3f6a58;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-dark);color:var(--chalk);font-family:'Space Grotesk',sans-serif;}

  .topnav{ position:sticky; top:0; z-index:100; background:var(--bg-dark); border-bottom:1px solid var(--board-line); }
  .topnav-inner{ max-width:720px; margin:0 auto; display:flex; gap:2px; padding:6px 16px; overflow-x:auto; }
  .topnav button{
    background:transparent; border:none; color:var(--chalk-dim); cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:500;
    padding:9px 13px; white-space:nowrap; border-bottom:2px solid transparent;
  }
  .topnav button:hover{ color:var(--chalk); }
  .topnav button.active{ color:var(--gold); font-weight:700; border-bottom-color:var(--gold); }
  .app{max-width:720px;margin:0 auto;padding:18px 16px 40px;}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:12px;}
  /* Placeholder logo \u2014 swap the <svg class="logo-placeholder"> markup in the HTML for an <img> once you've got a real one */
  .masthead-title{display:flex;align-items:center;gap:10px;}
  .logo-placeholder{flex-shrink:0;}
  .masthead h1{font-size:22px;font-weight:700;margin:0;letter-spacing:0.2px;}
  .masthead .tag{font-size:12px;color:var(--chalk-dim);text-align:right;line-height:1.4;cursor:default;}

  .field-wrap{position:relative;width:100%;border:1px solid var(--board-line);border-radius:2px;overflow:hidden;background:var(--board);}
  svg#field{display:block;width:100%;height:auto;}

  .down-bug{
    position:absolute; top:10px; left:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    padding:6px 10px;
    font-size:13px;
    line-height:1.5;
  }
  .down-bug b{color:var(--gold);}

  .role-bug{
    position:absolute; top:10px; right:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    padding:6px 10px;
    font-size:12px;
    line-height:1.5;
    text-align:right;
  }
  .role-bug b{color:var(--gold);}
  .role-bug.def b{color:var(--brick);}

  .pos-toggle{
    position:absolute; top:44px; right:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    color:var(--chalk-dim);
    padding:4px 9px;
    font-size:11px;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
  }
  .pos-toggle.on{ color:var(--gold); border-color:var(--gold); }

  .phase-callout{
    position:absolute; bottom:10px; left:10px; right:10px;
    font-family:'Kalam',cursive;
    font-size:17px;
    color:var(--chalk);
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }

  .panel{margin-top:14px;border-top:1px dashed var(--board-line);padding-top:14px;}
  .panel .prompt{font-size:15px;color:var(--chalk-dim);margin-bottom:10px;}
  .panel .prompt em{color:var(--chalk);font-style:normal;font-weight:500;}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:520px){ .choice-grid{grid-template-columns:1fr;} }

  .choice-btn{
    background:transparent;
    border:1px solid var(--board-line);
    color:var(--chalk);
    padding:10px 12px;
    text-align:left;
    cursor:pointer;
    font-family:'Space Grotesk',sans-serif;
  }
  .choice-btn:hover{border-color:var(--gold);background:rgba(232,196,104,0.06);}
  .choice-btn .name{display:block;font-weight:700;font-size:14px;margin-bottom:4px;}
  .choice-btn .desc{display:block;font-size:12px;color:var(--chalk-dim);line-height:1.4;}
  .choice-btn.def:hover{border-color:var(--brick);background:rgba(193,80,63,0.08);}
  .choice-btn.disabled-btn{ opacity:0.4; cursor:not-allowed; }
  .choice-btn.disabled-btn:hover{ border-color:var(--board-line); background:transparent; }
  .choice-btn.disabled-btn .desc{ color:var(--brick); font-style:italic; }

  .waiting{
    text-align:center;
    padding:34px 16px;
    border:1px dashed var(--board-line);
  }
  .waiting .icon{font-size:24px;margin-bottom:10px;}
  .waiting p{font-size:14px;color:var(--chalk-dim);margin:0;}
  .pulse{ animation:pulseDot 1.4s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }

  button, .primary-btn{
    background:var(--gold);
    color:#1a1509;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 20px;
    cursor:pointer;
  }
  button:hover, .primary-btn:hover{background:#f3d488;}
  button.ghost{ background:transparent; color:var(--chalk); border:1px solid var(--board-line); }
  button.ghost:hover{ border-color:var(--gold); background:rgba(232,196,104,0.06); }

  .result-box{border:1px dashed var(--gold);padding:14px;}
  .result-box .yards{font-size:26px;font-weight:700;color:var(--gold);margin-bottom:4px;}
  .result-box .story{font-family:'Kalam',cursive;font-size:16px;color:var(--chalk);margin:6px 0 14px;}
  .result-box .td{color:var(--brick);font-weight:700;font-size:15px;margin-bottom:6px;}

  .footer-link{margin-top:18px;text-align:center;}
  .footer-link a{color:var(--chalk-dim);font-size:12px;cursor:pointer;text-decoration:underline;margin:0 8px;}
  .footer-link a:hover{color:var(--chalk);}

  .marker-pop{ transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.2,1.4,0.4,1); }

  @keyframes burstRing{
    0%   { r:3;  stroke-width:4; opacity:0.95; }
    100% { r:24; stroke-width:1; opacity:0; }
  }
  .tackle-burst{ animation: burstRing 0.55s ease-out forwards; }

  #panel.fading{ opacity:0; transition:none; }
  #panel{ transition: opacity 0.16s ease; }

  /* --- lobby --- */
  .lobby-card{ border:1px dashed var(--board-line); padding:22px 18px; text-align:center; }
  .lobby-card h2{ font-size:18px; margin:0 0 6px; }
  .lobby-card p.sub{ font-size:13px; color:var(--chalk-dim); margin:0 0 20px; }
  .role-pick{ display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
  .role-pick button{ flex:1; max-width:180px; }
  .code-display{
    font-family:'Space Grotesk',sans-serif;
    font-size:38px; font-weight:700; letter-spacing:6px;
    color:var(--gold);
    border:1px dashed var(--gold);
    padding:14px 10px;
    margin:16px 0;
    cursor:pointer;
  }
  .code-hint{ font-size:12px; color:var(--chalk-dim); margin-bottom:18px; }
  .code-input{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px; letter-spacing:6px; text-align:center; text-transform:uppercase;
    background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:10px; width:180px; margin:0 auto 16px; display:block;
  }
  .code-input:focus{ outline:none; border-color:var(--gold); }
  .lobby-error{ color:var(--brick); font-size:13px; margin-bottom:14px; min-height:16px; }
  .lobby-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .divider{ margin:22px 0; border-top:1px dashed var(--board-line); }

  /* --- editor --- */
  .ed-toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .seg-toggle{ display:flex; border:1px solid var(--board-line); }
  .seg-toggle button{ background:transparent; color:var(--chalk-dim); border:none; padding:8px 12px; font-size:13px; font-weight:500; cursor:pointer; }
  .seg-toggle button.active{ background:var(--gold); color:#1a1509; font-weight:700; }
  .seg-toggle button.active.def{ background:var(--brick); color:var(--chalk); }
  .ed-select{
    background:#fff; border:1px solid var(--board-line); color:#000;
    padding:8px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;
  }
  .ed-select option{ color:#000; background:#fff; }
  .ed-input{
    background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:8px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;
  }
  .ed-input{ flex:1; min-width:140px; }
  .cat-btn-row{ display:flex; gap:6px; margin-bottom:10px; }
  .cat-btn{ background:transparent; border:1px solid var(--board-line); color:var(--chalk-dim); padding:7px 12px; font-size:12px; cursor:pointer; }
  .cat-btn.active{ border-color:var(--gold); color:var(--gold); }
  .ed-canvas-wrap{ position:relative; width:100%; border:1px solid var(--board-line); background:var(--board); touch-action:none; }
  .ed-hint{ font-size:12px; color:var(--chalk-dim); margin:10px 0; line-height:1.5; }
  .ed-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .custom-pill{ font-size:10px; color:var(--gold); border:1px solid var(--gold-dim); padding:1px 5px; margin-left:4px; vertical-align:middle; }
  .choice-btn-wrap{ position:relative; }
  .choice-btn-wrap .choice-btn{ width:100%; }
  .remove-btn{
    position:absolute; top:4px; right:4px; z-index:2;
    background:var(--brick-dim); color:var(--chalk); border:none;
    width:18px; height:18px; border-radius:2px; font-size:12px; line-height:1;
    cursor:pointer; padding:0;
  }
  .remove-btn:hover{ background:var(--brick); }
  .cat-heading{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--chalk-dim); margin:14px 0 6px; }
  .cat-heading:first-of-type{ margin-top:0; }
  .create-new-btn{
    width:100%; margin-top:14px; background:transparent; color:var(--chalk-dim);
    border:1px dashed var(--board-line); padding:12px; font-family:'Space Grotesk',sans-serif;
    font-size:13px; cursor:pointer;
  }
  .create-new-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .ed-actions button.active-toggle, button.active-toggle{ border-color:var(--gold); color:var(--gold); }

  .typed-call-row{ display:flex; gap:8px; margin-bottom:14px; }
  .typed-call-row input{
    flex:1; background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:9px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;
  }
  .typed-call-row input:focus{ outline:none; border-color:var(--gold); }
  .typed-call-row button{
    background:var(--gold); color:#1a1509; border:none; font-weight:700; font-size:13px;
    padding:9px 14px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  }

  .coach-tip{
    border:1px dashed var(--gold-dim);
    padding:10px 12px;
    margin-bottom:14px;
    font-family:'Kalam',cursive;
    font-size:14px;
    color:var(--chalk);
  }
  .coach-tip.def{ border-color:var(--brick-dim); }
  .coach-tip .coach-label{
    font-family:'Space Grotesk',sans-serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--gold-dim); display:block; margin-bottom:4px;
  }
  .coach-tip.def .coach-label{ color:var(--brick-dim); }
</style>
</head>
<body>
<nav class="topnav" id="topnav">
  <div class="topnav-inner">
    <button data-nav="home">Home</button>
    <button data-nav="editor">Practice</button>
    <button data-nav="landing">Play</button>
    <button data-nav="about">About</button>
    <button data-nav="leaderboard">Leaderboard</button>
    <button data-nav="feedback">Feedback</button>
  </div>
</nav>
<div class="app">

  <div class="masthead">
    <div class="masthead-title">
      <svg class="logo-placeholder" width="34" height="34" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="32" height="32" rx="6" fill="var(--board)" stroke="var(--gold-dim)" stroke-width="1.5"/>
        <circle cx="12" cy="17" r="6" fill="none" stroke="var(--gold)" stroke-width="2.2"/>
        <line x1="19" y1="10" x2="27" y2="24" stroke="var(--brick)" stroke-width="2.2"/>
        <line x1="19" y1="24" x2="27" y2="10" stroke="var(--brick)" stroke-width="2.2"/>
      </svg>
      <h1>Schemer</h1>
    </div>
    <div class="tag" id="mastheadTag">a tactical trainer<br>play it out with a friend</div>
  </div>

  <div id="lobby"></div>

  <div id="gameArea" style="display:none;">
    <div class="field-wrap">
      <svg id="field" viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="down-bug" id="downBug"></div>
      <div class="role-bug" id="roleBug"></div>
      <button class="pos-toggle" id="posToggle" type="button">labels</button>
      <div class="phase-callout" id="phaseCallout"></div>
    </div>

    <div class="panel" id="panel"></div>

    <div class="footer-link">
      <a id="restartLink">restart the drive</a>
      <a id="leaveLink">leave</a>
    </div>
  </div>

</div>

<script>
/* ================= firebase (fill this in \u2014 see instructions) ================= */
// 1. Go to https://console.firebase.google.com, create a free project.
// 2. Build > Realtime Database > Create Database (test mode is fine to start).
// 3. Project settings (gear icon) > General > "Your apps" > Add app > Web (</>).
// 4. Copy the config values it shows you into the object below.
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_API_KEY",
  databaseURL: "https://REPLACE-WITH-YOUR-PROJECT-default-rtdb.firebaseio.com",
  projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey.indexOf('REPLACE') === -1;

// TODO: replace with the real email you want feedback/bug reports sent to.
const FEEDBACK_EMAIL = "guydebasto@gmail.com";
if(FIREBASE_CONFIGURED) firebase.initializeApp(firebaseConfig);
const db = FIREBASE_CONFIGURED ? firebase.database() : null;

/* ================= data (unchanged game content) ================= */

const OL_X = [266, 293, 320, 347, 374]; // realistic-proportion OL splits (tightened from the old ~9.5yd-per-gap spacing)

const formations = {
  iform: { name:"I-Formation", note:"Two backs stacked behind center, tight end attached right \u2014 a power running look.",
    skill:[{label:'QB',x:320,y:22},{label:'FB',x:320,y:42},{label:'HB',x:320,y:62},{label:'TE',x:404,y:0},{label:'WR',x:175,y:0},{label:'WR',x:465,y:0}] },
  shotgun: { name:"Shotgun Spread", note:"Quarterback set back off the snap, three receivers spread wide \u2014 built to throw.",
    skill:[{label:'QB',x:320,y:52},{label:'RB',x:293,y:48},{label:'WR',x:175,y:0},{label:'WR',x:230,y:4},{label:'WR',x:465,y:0},{label:'TE',x:404,y:0}] },
  singleback: { name:"Singleback Trips", note:"One back, three receivers bunched right \u2014 balanced, leaning toward pass.",

  wildcat: { name:"Wildcat", note:"Direct snap to the running back \u2014 the quarterback flexes out wide as a decoy.",
    skill:[{label:'RB',x:320,y:44},{label:'FB',x:293,y:20},{label:'WR',x:175,y:0},{label:'WR',x:230,y:4},{label:'TE',x:404,y:0},{label:'WR',x:465,y:0}] },
  empty: { name:"Empty (5-Wide)", note:"No running back in sight \u2014 five receivers spread the field, everything is a pass.",

  goalline: { name:"Goal Line", note:"Two tight ends and two backs crowd the formation \u2014 built to smash forward for a yard, not spread the field.",
    skill:[{label:'QB',x:320,y:22},{label:'FB',x:320,y:44},{label:'HB',x:320,y:66},{label:'TE',x:404,y:0},{label:'TE',x:236,y:0},{label:'WR',x:465,y:0}] },

  ace: { name:"Ace", note:"One back, a tight end on each side \u2014 a balanced, two-way look that can run either direction.",
    skill:[{label:'QB',x:320,y:22},{label:'RB',x:320,y:46},{label:'TE',x:404,y:0},{label:'TE',x:236,y:0},{label:'WR',x:175,y:0},{label:'WR',x:465,y:0}] },
  bunch: { name:"Bunch Trips", note:"Three receivers bunched tight to one side, a lone receiver isolated on the backside \u2014 creates natural picks and confusion in coverage.",
    skill:[{label:'QB',x:320,y:52},{label:'RB',x:293,y:48},{label:'WR',x:445,y:6},{label:'WR',x:480,y:14},{label:'WR',x:460,y:22},{label:'WR',x:175,y:0}] },
  wishbone: { name:"Wishbone", note:"Three backs stacked in a wishbone shape behind center \u2014 an old-school option look built almost entirely to run.",

  shotguntwins: { name:"Shotgun Twins", note:"Two receivers stacked on each side, no tight end \u2014 four vertical or crossing options with a back to check down to.",

};

const fronts = {
  base43: { name:"4-3 Base", note:"Four down linemen, three linebackers \u2014 even numbers, honest against everything.",

  dime: { name:"Dime", note:"Six defensive backs on the field \u2014 an extra corner replaces a linebacker to blanket a pass-heavy set.",
    players:[{x:275,y:-10,role:'DL'},{x:305,y:-10,role:'DL'},{x:335,y:-10,role:'DL'},{x:365,y:-10,role:'DL'},{x:320,y:-40,role:'LB'},{x:160,y:-24,role:'CB'},{x:220,y:-24,role:'CB'},{x:420,y:-24,role:'CB'},{x:480,y:-24,role:'CB'},{x:280,y:-95,role:'S'},{x:360,y:-95,role:'S'}] },

const categoryMatrix = {
  run:        { runD:2,  passD:7, blitz:5 },
  pass:       { runD:8,  passD:3, blitz:5 },
  playAction: { runD:10, passD:4, blitz:2 },
  deep:       { runD:9,  passD:2, blitz:16 },
};
const CALL_ROLE_BY_CATEGORY = { runD:'LB', passD:'CB', blitz:'DL' };

function computeOutcome(g){
  const playObj = getPlay(g.offPlayKey, g.offPlayCustom);
  const callObj = getCall(g.defCallKey, g.defCallCustom);
  if(outcomes[g.offPlayKey] && outcomes[g.offPlayKey][g.defCallKey]){
    return outcomes[g.offPlayKey][g.defCallKey];
  }
  const base = categoryMatrix[playObj.category][callObj.category];
  const breakaway = callObj.category === 'blitz' && base >= 5;
  const tierText = base<=2 ? "and it's snuffed out for almost nothing"
    : base<=5 ? "and picks up a modest gain"
    : base<=8 ? "and finds a healthy chunk of yardage"
    : breakaway ? "and there's nobody left back there \u2014 he's gone"
    : "and breaks into the open for a big gain";
  return {
    yards: base,
    text: `${playObj.name} goes up against ${callObj.name} \u2014 ${tierText}.`,
    role: CALL_ROLE_BY_CATEGORY[callObj.category] || 'LB',
    breakaway,
  };
}

/* ---- typed-in play/call calling ---- */

function normalizeCallText(s){ return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' '); }
function titleCaseCall(s){ return s.trim().replace(/\w\S*/g, w=> w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); }

function resolveTypedEntry(text, builtinDict, customList){
  const target = normalizeCallText(text);
  if(!target) return null;
  for(const k in builtinDict){ if(normalizeCallText(builtinDict[k].name)===target) return {type:'built', key:k}; }
  for(const item of customList){ if(normalizeCallText(item.name)===target) return {type:'custom', item}; }
  for(const k in builtinDict){
    const n = normalizeCallText(builtinDict[k].name);
    if(n.includes(target) || target.includes(n)) return {type:'built', key:k};
  }
  for(const item of customList){
    const n = normalizeCallText(item.name);
    if(n.includes(target) || target.includes(n)) return {type:'custom', item};
  }
  return null;
}

function guessOffCategory(text){
  const t = text.toLowerCase();
  if(/deep|bomb|go route|nine route|shot downfield|seam|streak|fly route|four verticals|four vertical/.test(t)) return 'deep';
  if(/play[\s-]?action|\bpa\b|boot|bootleg|fake/.test(t)) return 'playAction';
  if(/screen|quick|slant|fade|post|corner route|dig|out\b|comeback|curl/.test(t)) return 'pass';
  if(/run|sweep|draw|dive|power|counter|iso|zone read|option|toss|trap|reverse|misdirection/.test(t)) return 'run';
  return 'pass';
}
function guessDefCategory(text){
  const t = text.toLowerCase();
  if(/blitz|pressure|\bzero\b|dog|fire\s?zone|overload/.test(t)) return 'blitz';
  if(/cover|zone|buzz|cloud|robber|man|press|quarters|palms|match/.test(t)) return 'passD';
  if(/run|box|stack|contain|spy|gap/.test(t)) return 'runD';
  return 'passD';
}
function soundsDefensive(text){
  return /\bblitz\b|\bzero\b|\bdog\b|fire\s?zone|\bcover\b|\bzone\b|\bbuzz\b|\bcloud\b|\brobber\b|\bpress\b|\bquarters\b|\bpalms\b|\bstunt\b|\bprevent\b|\bspy\b|\bnickel\b|\bdime\b/.test(text.toLowerCase());
}
function soundsOffensive(text){
  return /\bsweep\b|\breverse\b|\bscreen\b|\bslant\b|\bpost\b|\bcurl\b|\bcomeback\b|\bdraw\b|play[\s-]?action|\bbootleg\b|\bgo route\b|\bbomb\b|four verticals?|\bfade\b|\bdig\b|\btrap\b|\bcounter\b|\biso\b|\bdive\b|\btoss\b/.test(text.toLowerCase());
}

const OFF_TYPED_DEFAULTS = { run:{xTarget:340,bend:0.3}, pass:{xTarget:460,bend:0.55}, playAction:{xTarget:390,bend:0.4}, deep:{xTarget:400,bend:0.25} };

async function handleTypedPlay(text, onPick, onPickCustom){
  const clean = (text||'').trim();
  if(!clean) return "Type in a play first.";
  const match = resolveTypedEntry(clean, plays, customOffPlays);
  if(match){
    if(match.type==='built' && plays[match.key].needsBack && !formationHasBack(game.offKey, game.offCustom)){
      return `${plays[match.key].name} needs a running back in your formation \u2014 you don't have one on the field.`;
    }
    match.type==='built' ? onPick(match.key) : onPickCustom(match.item); return null;
  }
  const defMatch = resolveTypedEntry(clean, calls, customDefCalls);
  if(defMatch || soundsDefensive(clean)){
    return `"${clean}" sounds like a defensive call \u2014 you're calling the offence.`;
  }
  const category = guessOffCategory(clean);
  const d = OFF_TYPED_DEFAULTS[category];
  const item = { id: genId(), name: titleCaseCall(clean), category, note:"Called on the fly.", xTarget:d.xTarget, bend:d.bend };
  customOffPlays = customOffPlays.filter(x=>x.id!==item.id);
  customOffPlays.push(item);
  await saveCustomList(CUSTOM_STORE_KEYS.offPlay, customOffPlays);
  onPickCustom(item);
  return null;
}

async function handleTypedCall(text, onPick, onPickCustom){
  const clean = (text||'').trim();
  if(!clean) return "Type in a call first.";
  const match = resolveTypedEntry(clean, calls, customDefCalls);
  if(match){ match.type==='built' ? onPick(match.key) : onPickCustom(match.item); return null; }
  const offMatch = resolveTypedEntry(clean, plays, customOffPlays);
  if(offMatch || soundsOffensive(clean)){
    return `"${clean}" sounds like an offensive play \u2014 you're calling the defence.`;
  }
  const category = guessDefCategory(clean);
  const item = { id: genId(), name: titleCaseCall(clean), category, note:"Called on the fly." };
  customDefCalls = customDefCalls.filter(x=>x.id!==item.id);
  customDefCalls.push(item);
  await saveCustomList(CUSTOM_STORE_KEYS.defCall, customDefCalls);
  onPickCustom(item);
  return null;
}

/* ---- coach's recommendation, by down and distance ---- */

function offCoachTip(down, distance, ballOn){
  if(ballOn <= 10) return "Backed up near your own goal \u2014 keep it simple, avoid a disaster in the end zone.";
  if(ballOn >= 90) return "Red zone \u2014 the field's shrunk, high-percentage plays beat a low-odds home run here.";
  if(down === 4) return distance <= 2
    ? "Fourth and short \u2014 this is a power down, put it in your best hands."
    : "Fourth and long \u2014 you need a lot, but forcing a deep shot rarely ends well.";
  if(down === 3){
    if(distance <= 2) return "Third and short \u2014 stay on schedule, a safe run or quick throw does the job.";
    if(distance <= 6) return "Third and manageable \u2014 call something you trust to move the sticks.";
    return "Third and long \u2014 the defense expects a pass, but there's time to find a check-down first.";
  }
  if(down === 2){
    if(distance <= 3) return "Second and short \u2014 stay aggressive, another chunk sets up an easy third down.";
    if(distance <= 7) return "Second and medium \u2014 stay balanced, keep the defense guessing.";
    return "Second and long \u2014 start working your way back to a manageable third down.";
  }
  return "First down \u2014 fresh set of downs, establish whatever look you like.";
}

function defCoachTip(down, distance, ballOn){
  if(ballOn <= 10) return "They're backed up near their own goal \u2014 good spot to pin your ears back, a big loss here is huge.";
  if(ballOn >= 90) return "They're deep in the red zone \u2014 the field's shrunk, keep everything in front of you.";
  if(down === 4) return distance <= 2
    ? "Fourth and short \u2014 they're going for it, load the box."
    : "Fourth and long \u2014 they need a lot, make them earn it downfield.";
  if(down === 3){
    if(distance <= 2) return "Third and short \u2014 expect the run, but don't ignore a quick pass.";
    if(distance <= 6) return "Third and manageable \u2014 disguise the coverage, this is a passing down.";
    return "Third and long \u2014 rush the passer, a sack or incompletion ends the drive.";
  }
  if(down === 2){
    if(distance <= 3) return "Second and short \u2014 stay honest against the run.";
    if(distance <= 7) return "Second and medium \u2014 balanced call, don't overcommit either way.";
    return "Second and long \u2014 good spot to pressure, they're behind schedule.";
  }
  return "First down \u2014 read their formation, no need to guess yet.";
}

const AI_DIFFICULTIES = {
  easy:       { name:"Easy",       exponent:0.3 },
  medium:     { name:"Medium",     exponent:0.7 },
  hard:       { name:"Hard",       exponent:1.2 },
  insane:     { name:"Insane",     exponent:1.8 },
  impossible: { name:"Impossible", exponent:3.0 },
};

const OFF_PLAYSTYLES = {
  balanced:    { name:"Balanced",         weights:{run:1,pass:1,playAction:1,deep:1} },
  aggressive:  { name:"Aggressive",       weights:{run:0.7,pass:1,playAction:1.2,deep:1.8} },
  conservative:{ name:"Conservative",     weights:{run:1.8,pass:0.8,playAction:1,deep:0.4} },
  bigplay:     { name:"Big-Play Hunter",  weights:{run:0.5,pass:0.7,playAction:1.3,deep:2.2} },
  westcoast:   { name:"West Coast",       weights:{run:0.8,pass:1.8,playAction:1,deep:0.3} },
  screenheavy: { name:"Screen-Heavy",     weights:{run:1,pass:1.2,playAction:0.8,deep:0.5}, keyBoost:{screen:3} },
};
const DEF_PLAYSTYLES = {
  balanced:    { name:"Balanced",         weights:{runD:1,passD:1,blitz:1} },
  aggressive:  { name:"Aggressive (Blitz-Heavy)", weights:{runD:0.8,passD:0.8,blitz:2.2} },
  conservative:{ name:"Conservative (Prevent-Heavy)", weights:{runD:1,passD:1.3,blitz:0.4}, keyBoost:{prevent:2} },
  zoneheavy:   { name:"Zone-Heavy",       weights:{runD:1,passD:1.2,blitz:0.9}, keyBoost:{zoneDrop:2.5} },
  manheavy:    { name:"Man-Heavy",        weights:{runD:1,passD:1.1,blitz:1}, keyBoost:{manPress:2.5} },
  runstuff:    { name:"Run-Stuffing",     weights:{runD:2,passD:0.8,blitz:0.9} },
};

function situationalOffWeights(down, distance, ballOn){
  const w = {run:1,pass:1,playAction:1,deep:1};
  if(distance<=3){ w.run*=1.6; w.deep*=0.5; }
  else if(distance>=8){ w.pass*=1.4; w.deep*=1.3; w.run*=0.6; }
  if(down===3 && distance>=7) w.pass*=1.3;
  if(down===1) w.playAction*=1.2;
  if(ballOn>=90){ w.deep*=0.4; w.run*=1.3; }
  if(ballOn<=10) w.deep*=0.6;
  return w;
}
function situationalDefWeights(down, distance, ballOn){
  const w = {runD:1,passD:1,blitz:1};
  if(distance<=3){ w.runD*=1.5; w.blitz*=1.1; }
  else if(distance>=8){ w.passD*=1.4; w.blitz*=1.2; w.runD*=0.6; }
  if(down===3 && distance>=7){ w.blitz*=1.2; w.passD*=1.2; }
  if(ballOn>=90) w.passD*=1.3;
  return w;
}

function aiWeightedPick(entries, difficultyKey){
  // entries: [{key,item,isCustom,weight}]
  const exp = (AI_DIFFICULTIES[difficultyKey]||AI_DIFFICULTIES.medium).exponent;
  const sharpened = entries.map(e=> ({...e, w: Math.pow(Math.max(0.05,e.weight), exp)}));
  const total = sharpened.reduce((s,e)=>s+e.w, 0);
  let r = Math.random()*total;
  for(const e of sharpened){ r -= e.w; if(r<=0) return e; }
  return sharpened[sharpened.length-1];
}

function aiPickPlay(down, distance, ballOn, difficultyKey, styleKey, hasBack){
  const style = OFF_PLAYSTYLES[styleKey] || OFF_PLAYSTYLES.balanced;
  const sit = situationalOffWeights(down, distance, ballOn);
  const entries = [];
  Object.keys(plays).forEach(k=>{
    if(plays[k].needsBack && hasBack===false) return;
    const cat = plays[k].category;
    const w = (style.weights[cat]||1) * (sit[cat]||1) * ((style.keyBoost&&style.keyBoost[k])||1);
    entries.push({key:k, item:plays[k], isCustom:false, weight:w});
  });
  customOffPlays.forEach(item=>{
    const cat = item.category;
    const w = (style.weights[cat]||1) * (sit[cat]||1);
    entries.push({key:item.id, item, isCustom:true, weight:w});
  });
  return aiWeightedPick(entries, difficultyKey);
}
function aiPickCall(down, distance, ballOn, difficultyKey, styleKey){
  const style = DEF_PLAYSTYLES[styleKey] || DEF_PLAYSTYLES.balanced;
  const sit = situationalDefWeights(down, distance, ballOn);
  const entries = [];
  Object.keys(calls).forEach(k=>{
    const cat = calls[k].category;
    const w = (style.weights[cat]||1) * (sit[cat]||1) * ((style.keyBoost&&style.keyBoost[k])||1);
    entries.push({key:k, item:calls[k], isCustom:false, weight:w});
  });
  customDefCalls.forEach(item=>{
    const cat = item.category;
    const w = (style.weights[cat]||1) * (sit[cat]||1);
    entries.push({key:item.id, item, isCustom:true, weight:w});
  });
  return aiWeightedPick(entries, difficultyKey);
}
function aiPickFormation(down, distance){
  // cosmetic choice \u2014 lean toward heavier personnel on short yardage, lighter on long yardage
  const keys = Object.keys(formations);
  const entries = keys.map(k=>{
    const p = computeOffPersonnel(formations[k].skill);
    const backs = parseInt(p[0],10);
    let w = 1;
    if(distance<=3) w = 1 + backs*0.4;
    else if(distance>=8) w = 1 + (2-backs)*0.3;
    return {key:k, item:formations[k], isCustom:false, weight:Math.max(0.2,w)};
  });
  return aiWeightedPick(entries, 'medium');
}
function aiPickFront(){
  const keys = Object.keys(fronts);
  const entries = keys.map(k=>({key:k, item:fronts[k], isCustom:false, weight:1}));
  return aiWeightedPick(entries, 'medium');
}

let sessionStartMs = null;

function ensurePlayerName(){
  let name = lsGetJSON('schemer:playerName');
  if(!name){
    name = prompt('Pick a name for the leaderboard:');
    if(name){ name = name.trim().slice(0,24); if(name) lsSetJSON('schemer:playerName', name); }
  }
  return name || null;
}

function sanitizeLbKey(name){ return name.replace(/[.#$\[\]\/]/g, '_').slice(0,40); }

async function incrementLeaderboardStat(field, amount){
  if(!FIREBASE_CONFIGURED) return;
  const name = ensurePlayerName();
  if(!name) return;
  try{
    await db.ref('leaderboard/'+sanitizeLbKey(name)).update({
      name: name,
      [field]: firebase.database.ServerValue.increment(amount),
    });
  }catch(e){ /* best effort */ }
}

function recordGameEvent(r){
  if(!r || (mode!=='ai' && mode!=='online')) return;
  if(r.touchdown && myRole==='offense') incrementLeaderboardStat('touchdowns', 1);
  const isTurnoverOnDowns = r.driveOver && !r.touchdown && !r.special;
  const isMissedFG = r.fieldGoalMade === false;
  if((isTurnoverOnDowns || isMissedFG) && myRole==='defense') incrementLeaderboardStat('stops', 1);
}

function flushPlaytime(){
  if(sessionStartMs && (mode==='ai' || mode==='online')){
    const elapsed = (Date.now() - sessionStartMs) / 1000;
    if(elapsed >= 1) incrementLeaderboardStat('playtime', Math.round(elapsed));
  }
  sessionStartMs = null;
}

async function loadLeaderboard(){
  const el = document.getElementById('lbContent');
  if(!el) return;
  try{
    const snap = await db.ref('leaderboard').once('value');
    const all = snap.val() || {};
    const list = Object.keys(all).map(k=>all[k]);
    const top = (field)=> list.filter(x=>x && x[field]).sort((a,b)=>(b[field]||0)-(a[field]||0)).slice(0,5);
    const fmtTime = (s)=>{ s=Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60); return h>0 ? `${h}h ${m}m` : `${m}m`; };
    const renderList = (title, entries, field, formatter)=>{
      let html = `<div class="cat-heading">${title}</div>`;
      if(!entries.length) return html + `<p class="sub">No games recorded yet.</p>`;
      entries.forEach((e,i)=>{ html += `<div class="prompt">${i+1}. <em>${e.name}</em> \u2014 ${formatter?formatter(e[field]):e[field]}</div>`; });
      return html;
    };
    el.innerHTML = renderList('Most Playtime', top('playtime'), 'playtime', fmtTime)
      + renderList('Most Touchdowns', top('touchdowns'), 'touchdowns')
      + renderList('Most Stops', top('stops'), 'stops');
  }catch(e){
    el.innerHTML = "Couldn't load the leaderboard right now.";
  }
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function notConfiguredNotice(){
  alert("Online multiplayer needs a Firebase config \u2014 fill in the firebaseConfig object near the top of this file (see the comment above it for instructions).");

async function createRoom(role, clockOn){
  if(!FIREBASE_CONFIGURED){ notConfiguredNotice(); return; }
  if(FIREBASE_CONFIGURED) ensurePlayerName();
  mode = 'online';
  roomCode = genCode();
  myRole = role;
  roomMeta = { offenseTaken: role==='offense', defenseTaken: role==='defense' };
  game = freshGame({ clockOn: !!clockOn });
  try{ await roomRef(roomCode).set({meta:roomMeta, game}); } catch(e){ alert('Could not reach the multiplayer server: ' + e.message); return; }
  lsSetJSON(SESSION_KEY, {roomCode, role});
  appScreen = 'waiting';
  renderLobby();
  attachRoomListener();
}

  mode = 'local';
  myRole = null;
  roomCode = null;
  roomMeta = null;
  game = freshGame({ clockOn: !!clockOn });
  enterGame();
}

  if(FIREBASE_CONFIGURED) ensurePlayerName();
  mode = 'ai';
  myRole = humanSide;
  roomCode = null;
  roomMeta = null;

async function joinRoom(codeRaw){
  if(!FIREBASE_CONFIGURED){ notConfiguredNotice(); return; }
  const code = codeRaw.toUpperCase().trim();
  if(code.length < 3){ showJoinError('Enter the room code your friend sent you.'); return; }
  let roomObj;
  try{ const snap = await roomRef(code).once('value'); roomObj = snap.val(); }
  catch(e){ showJoinError("Couldn't reach the multiplayer server \u2014 check your connection."); return; }
  if(!roomObj){ showJoinError("Couldn't find a room with that code."); return; }
  let role;
  if(!roomObj.meta.offenseTaken) role = 'offense';
  else if(!roomObj.meta.defenseTaken) role = 'defense';
  else { showJoinError('That room already has two players.'); return; }
  roomObj.meta[role+'Taken'] = true;
  await roomRef(code).set(roomObj);
  mode = 'online'; roomCode = code; myRole = role; roomMeta = roomObj.meta; game = roomObj.game;
  lsSetJSON(SESSION_KEY, {roomCode, role});
  enterGame();
}

function showJoinError(msg){

  if(e) e.textContent = msg;
}

async function tryResumeSession(){
  if(!FIREBASE_CONFIGURED) return false;
  const sess = lsGetJSON(SESSION_KEY);
  if(!sess) return false;
  let roomObj;
  try{ const snap = await roomRef(sess.roomCode).once('value'); roomObj = snap.val(); }
  catch(e){ return false; }
  if(!roomObj || !roomObj.meta[sess.role+'Taken']) return false;
  mode = 'online';
  roomCode = sess.roomCode; myRole = sess.role; roomMeta = roomObj.meta; game = roomObj.game;
  if(roomMeta.offenseTaken && roomMeta.defenseTaken){
    enterGame();
  } else {
    appScreen = 'waiting';
    renderLobby();
    attachRoomListener();
  }
  return true;
}

  document.querySelectorAll('.topnav button').forEach(b=> b.classList.toggle('active', b.dataset.nav===active));

let roomListenerRef = null;
function attachRoomListener(){
  detachRoomListener();
  if(!roomCode) return;
  roomListenerRef = roomRef(roomCode);
  roomListenerRef.on('value', snap=>{
    const roomObj = snap.val();
    if(!roomObj) return;
    roomMeta = roomObj.meta;
    if(appScreen === 'waiting'){
      if(roomMeta.offenseTaken && roomMeta.defenseTaken){ game = roomObj.game; enterGame(); }
      return;
    }
    if(appScreen === 'in-game'){
      if(!game || roomObj.game.seq !== game.seq){ game = roomObj.game; render(); }
    }
  });
}
function detachRoomListener(){ if(roomListenerRef){ roomListenerRef.off(); roomListenerRef = null; } }

async function writeGame(mutator){
  const wasResult = game.phase === 'RESULT';
  const copy = JSON.parse(JSON.stringify(game));
  mutator(copy);
  copy.seq = (game.seq||0) + 1;
  const justResolved = !wasResult && copy.phase === 'RESULT';
  game = copy;
  render();
  if(justResolved) recordGameEvent(copy.lastResult);
  if(mode === 'online'){
    try{ await roomRef(roomCode).set({meta:roomMeta, game}); } catch(e){ /* will retry on next action */ }
  }
}

function enterGame(){
  appScreen = 'in-game';
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('mastheadTag').innerHTML = mode === 'local'
    ? 'local 2-player'
    : 'room <b style="color:var(--gold)">'+roomCode+'</b>';
  if(mode === 'ai' || mode === 'online') sessionStartMs = Date.now();
  drawStaticField();
  render();
  updateNavActive();
}

/* ================= svg field (identical mechanics to the local build) ================= */

const PX_PER_YARD = 6.2;
const BASE_Y = 680;
function losY(ballOn){ return BASE_Y - (ballOn/100)*620; }

const svgNS = "http://www.w3.org/2000/svg";
const field = document.getElementById('field');

function el(name, attrs){
  const e = document.createElementNS(svgNS, name);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawStaticField(){
  field.innerHTML = '';
  field.appendChild(el('rect',{x:0,y:0,width:640,height:760,fill:'var(--board)'}));
  field.appendChild(el('rect',{x:0,y:0,width:640,height:60,fill:'var(--board-line)'}));
  field.appendChild(el('rect',{x:0,y:700,width:640,height:60,fill:'var(--board-line)'}));
  field.appendChild(el('line',{x1:40,y1:0,x2:40,y2:760,stroke:'var(--chalk-dim)','stroke-width':1.5}));
  field.appendChild(el('line',{x1:600,y1:0,x2:600,y2:760,stroke:'var(--chalk-dim)','stroke-width':1.5}));
  for(let y=10;y<100;y+=10){
    const yy = losY(y);
    field.appendChild(el('line',{x1:40,y1:yy,x2:600,y2:yy,stroke:'var(--hash)','stroke-width':1}));
    const label = Math.min(y,100-y);
    [90,550].forEach(lx=>{
      const t = el('text',{x:lx,y:yy+4,fill:'var(--hash)','font-size':13,'font-family':"'Space Grotesk',sans-serif",'text-anchor':'middle'});
      t.textContent = label;
      field.appendChild(t);
    });
  }
  for(let y=2;y<100;y+=2){
    const yy = losY(y);
    [260,380].forEach(hx=>{
      field.appendChild(el('line',{x1:hx,y1:yy,x2:hx+8,y2:yy,stroke:'var(--hash)','stroke-width':1}));
    });
  }
  field.appendChild(el('g',{id:'dynamic'}));
}

function clearDynamic(){ const dyn = document.getElementById('dynamic'); dyn.innerHTML=''; return dyn; }

function drawLineMarker(dyn, y, color, dashed){
  const attrs = {x1:40,y1:y,x2:600,y2:y,stroke:color,'stroke-width':2};
  if(dashed) attrs['stroke-dasharray'] = '6,5';
  dyn.appendChild(el('line', attrs));
}

const FIELD_TOP_Y = 64, FIELD_BOTTOM_Y = 696; // keeps players out of the end zones
function clampFieldY(y){ return Math.max(FIELD_TOP_Y, Math.min(FIELD_BOTTOM_Y, y)); }

function offensePositionLabels(formKey){
  const f = formations[formKey];
  if(!f) return null; // custom formations don't carry position labels
  const labels = new Array(11).fill(null);
  f.skill.forEach((p,i)=>{ labels[5+i] = p.label; });
  return labels;
}

function drawOffense(dyn, formKey, formCustom, ly, animate, motionOverride){
  const pts = offensePoints(formKey, formCustom);
  const labels = showPosLabels ? offensePositionLabels(formKey) : null;
  pts.forEach((p,i)=>{
    let x = p.x, y = clampFieldY(ly+p.y);
    if(motionOverride && i===motionOverride.index){ x = motionOverride.pos.x; y = clampFieldY(ly+motionOverride.pos.y); }
    if(labels && labels[i]){
      dyn.appendChild(makeLabelMarker(x, y, labels[i], 'var(--gold)', animate, i));
    } else {
      dyn.appendChild(makeMarker(x, y, i===2?'square':'X', 'var(--gold)', animate, i));
    }
  });
}
function drawDefense(dyn, frontKey, frontCustom, ly, animate){
  const pts = defensePoints(frontKey, frontCustom);
  if(showPosLabels){
    const labels = computePositionLabels(pts);
    pts.forEach((p,i)=> dyn.appendChild(makeLabelMarker(p.x, clampFieldY(ly+p.y), labels[i]||p.role||'?', 'var(--brick)', animate, i)));
  } else {
    pts.forEach((p,i)=> dyn.appendChild(makeMarker(p.x, clampFieldY(ly+p.y), 'O', 'var(--brick)', animate, i)));
  }
}

function makeMarker(x,y,shape,color,animate,idx){
  const g = el('g',{});
  if(shape==='X'){ const s=7;
    g.appendChild(el('line',{x1:x-s,y1:y-s,x2:x+s,y2:y+s,stroke:color,'stroke-width':2}));
    g.appendChild(el('line',{x1:x-s,y1:y+s,x2:x+s,y2:y-s,stroke:color,'stroke-width':2}));
  } else if(shape==='square'){ const s=8;
    g.appendChild(el('rect',{x:x-s,y:y-s,width:s*2,height:s*2,fill:'none',stroke:color,'stroke-width':2}));
  } else {
    g.appendChild(el('circle',{cx:x,cy:y,r:9,fill:'none',stroke:color,'stroke-width':2}));
  }
  if(animate){
    g.classList.add('marker-pop');
    g.style.transformOrigin = x+'px '+y+'px';
    g.style.transformBox = 'fill-box';
    g.style.opacity = '0';
    g.style.transform = 'scale(0.2)';
    g.style.transitionDelay = (idx*22)+'ms';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ g.style.opacity='1'; g.style.transform='scale(1)'; }));
  }
  return g;
}

function makeLabelMarker(x,y,text,color,animate,idx){
  const g = el('g',{});
  const t = el('text',{x,y:y+4,'text-anchor':'middle','font-size':11,'font-family':"'Space Grotesk',sans-serif",'font-weight':700,fill:color});
  t.textContent = text;
  g.appendChild(t);
  if(animate){
    g.classList.add('marker-pop');
    g.style.transformOrigin = x+'px '+y+'px';
    g.style.transformBox = 'fill-box';
    g.style.opacity = '0';
    g.style.transform = 'scale(0.2)';
    g.style.transitionDelay = (idx*22)+'ms';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ g.style.opacity='1'; g.style.transform='scale(1)'; }));
  }
  return g;
}

function computePositionLabels(players){
  const labels = new Array(players.length).fill('');
  const byRole = {DL:[],LB:[],CB:[],S:[]};
  players.forEach((p,i)=>{ if(byRole[p.role]) byRole[p.role].push(i); });

  const dl = byRole.DL.slice().sort((a,b)=>players[a].x-players[b].x);
  if(dl.length===1) labels[dl[0]]='NT';
  else dl.forEach((idx,pos)=>{ labels[idx] = (pos===0||pos===dl.length-1) ? 'DE' : 'DT'; });

  const lb = byRole.LB.slice().sort((a,b)=>players[a].x-players[b].x);
  if(lb.length===1) labels[lb[0]]='MLB';
  else lb.forEach((idx,pos)=>{ labels[idx] = (pos===0||pos===lb.length-1) ? 'OLB' : 'MLB'; });

  const cb = byRole.CB.slice().sort((a,b)=> Math.abs(players[a].x-320)-Math.abs(players[b].x-320));
  cb.forEach((idx,pos)=>{ labels[idx] = pos < cb.length-2 ? 'NB' : 'CB'; });

  const s = byRole.S.slice().sort((a,b)=> players[a].y-players[b].y);
  s.forEach((idx,pos)=>{ labels[idx] = pos===0 ? 'FS' : 'SS'; });

  // spatial correction: a defensive end lined up wider than the actual corners isn't
  // playing like a traditional end anymore \u2014 relabel by where he really stands
  const cbWidths = cb.map(idx => Math.abs(players[idx].x - 320));
  const narrowestCB = cbWidths.length ? Math.min(...cbWidths) : Infinity;
  labels.forEach((lab, idx)=>{
    if(lab === 'DE' && Math.abs(players[idx].x - 320) > narrowestCB) labels[idx] = 'OLB';
  });

  // a manually typed-in label always wins over the auto-computed one
  players.forEach((p,idx)=>{ if(p.customLabel) labels[idx] = p.customLabel; });

  return labels;
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
function easeInCubic(t){ return t*t*t; }
function quadPoint(p0, c, p1, t){
  const mt = 1-t;
  return { x: mt*mt*p0.x + 2*mt*t*c.x + t*t*p1.x, y: mt*mt*p0.y + 2*mt*t*c.y + t*t*p1.y };
}
function setAttrs(el2,attrs){ for(const k in attrs) el2.setAttribute(k, attrs[k]); }

function synthesizeRouteOffset(startPt, category, seedIndex){
  // a simple, deterministic generic route for players without one explicitly drawn
  const side = startPt.x < 320 ? -1 : 1;
  const isPassy = (category==='pass' || category==='deep' || category==='playAction');
  const forward = isPassy ? 55 : 25; // pass plays send receivers further downfield; run plays are shorter releases/blocks
  const lateral = isPassy ? 10*side : 18*side;
  return { dx: lateral, dy: -forward - (seedIndex%3)*6 };
}

function routeOffsetFor(play, p, i){
  if(typeof play.routes === 'function') return play.routes(p, i);
  if(play.routes && play.routes[i]) return play.routes[i];
  return synthesizeRouteOffset(p, play.category, i);
}

function routeEndpointsFor(play, offKey, offCustom, ly){
  const pts = offensePoints(offKey, offCustom);
  const list = [];
  for(let i=5; i<pts.length; i++){
    const p = pts[i];
    const start = { x:p.x, y: ly+p.y };
    const offset = routeOffsetFor(play, p, i);
    const end = {
      x: Math.max(48, Math.min(592, start.x + offset.dx)),
      y: Math.min(ly, start.y + offset.dy), // routes run upfield, never backward past the snap depth
    };
    list.push({ start, end });
  }
  return list;
}

function buildRouteAnimators(dyn, ly, play, offKey, offCustom){
  const endpoints = routeEndpointsFor(play, offKey, offCustom, ly);
  const animators = [];
  endpoints.forEach(({start,end})=>{
    const marker = makeMarker(start.x, start.y, 'X', 'var(--gold-dim)', false, 0);
    const lines = marker.querySelectorAll('line');
    lines.forEach(l=> l.setAttribute('stroke-width', 2));
    const offsets = Array.from(lines).map(l=>({
      x1:parseFloat(l.getAttribute('x1')), y1:parseFloat(l.getAttribute('y1')),
      x2:parseFloat(l.getAttribute('x2')), y2:parseFloat(l.getAttribute('y2')),
    }));
    dyn.appendChild(marker);
    animators.push({ start, end, lines, offsets });
  });
  return animators;
}

function drawPlayResult(dyn, ly, animate){
  const r = game.lastResult;
  const play = getPlay(game.offPlayKey, game.offPlayCustom);
  const startX = 320, startY = ly;
  const t = Math.min(r.yards/8,1);
  const finalX = startX + (play.xTarget - startX)*t;
  const finalY = ly - r.yards*PX_PER_YARD;

  const bend = play.bend;
  const control = {
    x: startX + (finalX - startX) * (0.35 + bend*0.35),
    y: startY - (startY - finalY) * (0.15 + (1-bend)*0.35),
  };
  const p0 = {x:startX,y:startY}, p1 = {x:finalX,y:finalY};

  const routeAnimators = game.offKey ? buildRouteAnimators(dyn, ly, play, game.offKey, game.offCustom) : [];

  const ball = makeMarker(startX, startY, 'X', 'var(--gold)', false, 0);
  const ballLines = ball.querySelectorAll('line');
  ballLines.forEach(l=> { l.setAttribute('stroke-width', 3); l.setAttribute('stroke-dasharray', '5,4'); });
  const ballOffsets = Array.from(ballLines).map(l=>({
    x1:parseFloat(l.getAttribute('x1')), y1:parseFloat(l.getAttribute('y1')),
    x2:parseFloat(l.getAttribute('x2')), y2:parseFloat(l.getAttribute('y2')),
  }));
  dyn.appendChild(ball);

  const frPlayers = defensePoints(game.defFrontKey, game.defFrontCustom);
  const roleMatches = frPlayers.filter(p=>p.role===r.role);
  const pool = roleMatches.length ? roleMatches : frPlayers;
  let closest = pool[0], bestDist = Infinity;
  pool.forEach(p=>{ const d = Math.abs(p.x - finalX); if(d < bestDist){ bestDist = d; closest = p; } });
  const defStart = {x:closest.x, y: ly + closest.y};
  const defMarker = makeMarker(defStart.x, defStart.y, 'O', 'var(--brick)', false, 0);
  const defCircle = defMarker.querySelector('circle');
  defCircle.setAttribute('stroke-width', 3);
  dyn.appendChild(defMarker);

  if(!animate){
    const dx0 = finalX - startX, dy0 = finalY - startY;
    ballLines.forEach((l,i)=> setAttrs(l, {x1:ballOffsets[i].x1+dx0, y1:ballOffsets[i].y1+dy0, x2:ballOffsets[i].x2+dx0, y2:ballOffsets[i].y2+dy0}));
    defCircle.setAttribute('cx', finalX); defCircle.setAttribute('cy', finalY);
    routeAnimators.forEach(a=>{
      const ddx = a.end.x-a.start.x, ddy = a.end.y-a.start.y;
      a.lines.forEach((l,i)=> setAttrs(l, {x1:a.offsets[i].x1+ddx, y1:a.offsets[i].y1+ddy, x2:a.offsets[i].x2+ddx, y2:a.offsets[i].y2+ddy}));
    });
    return;
  }

  const DURATION = 1500, DEF_DELAY = 150;
  const t0 = performance.now();
  function frame(now){
    const elapsed = now - t0;
    const ballT = Math.min(elapsed/DURATION, 1);
    const pos = quadPoint(p0, control, p1, easeOutCubic(ballT));
    const dx0 = pos.x - startX, dy0 = pos.y - startY;
    ballLines.forEach((l,i)=> setAttrs(l, {x1:ballOffsets[i].x1+dx0, y1:ballOffsets[i].y1+dy0, x2:ballOffsets[i].x2+dx0, y2:ballOffsets[i].y2+dy0}));

    const routeT = easeOutCubic(ballT);
    routeAnimators.forEach(a=>{
      const rx = a.start.x + (a.end.x-a.start.x)*routeT, ry = a.start.y + (a.end.y-a.start.y)*routeT;
      const rdx = rx-a.start.x, rdy = ry-a.start.y;
      a.lines.forEach((l,i)=> setAttrs(l, {x1:a.offsets[i].x1+rdx, y1:a.offsets[i].y1+rdy, x2:a.offsets[i].x2+rdx, y2:a.offsets[i].y2+rdy}));
    });

    const defElapsed = Math.max(0, elapsed - DEF_DELAY);
    const defT = Math.min(defElapsed/(DURATION - DEF_DELAY*0.6), 1);
    const defEase = easeInCubic(defT);
    const dcx = defStart.x + (finalX-defStart.x)*defEase, dcy = defStart.y + (finalY-defStart.y)*defEase;
    defCircle.setAttribute('cx', dcx); defCircle.setAttribute('cy', dcy);

    if(ballT < 1 || defT < 1){ requestAnimationFrame(frame); }
    else{
      const burst = el('circle',{cx:finalX,cy:finalY,r:3,fill:'none',stroke:'var(--chalk)'});
      burst.classList.add('tackle-burst');
      dyn.appendChild(burst);
      setTimeout(()=>{ renderPanel(); }, 220);
    }
  }
  requestAnimationFrame(frame);
}

/* ---- pre-snap motion ---- */

const MOTION_TYPES = { jet:'Jet', orbit:'Orbit', shift:'Shift', return:'Return' };

function motionManIndex(g){
  const pts = offensePoints(g.offKey, g.offCustom);
  let idx = 5, maxW = -1;
  for(let i=5; i<pts.length; i++){
    const w = Math.abs(pts[i].x - 320);
    if(w > maxW){ maxW = w; idx = i; }
  }
  return idx;
}

function clampToLOS(y){ return Math.max(8, Math.min(70, y)); } // motion must stay clearly behind the line \u2014 never on/ahead of it, and never absurdly deep into the backfield

function clampFieldX(x){ return Math.max(48, Math.min(592, x)); }

function resolveMotionCollision(pos, allPoints, selfIdx){
  let p = { x:pos.x, y:pos.y };
  for(let attempt=0; attempt<20; attempt++){
    let collision = null;
    for(let i=0; i<allPoints.length; i++){
      if(i===selfIdx) continue;
      const d = Math.hypot(allPoints[i].x-p.x, allPoints[i].y-p.y);
      if(d < 22){ collision = allPoints[i]; break; }
    }
    if(!collision) break;
    const dx = p.x - collision.x, dy = p.y - collision.y;
    const len = Math.hypot(dx,dy);
    if(len < 0.5){
      // exactly coincident (common with jet motion into a symmetric formation) \u2014
      // the direction-away-from-collision vector is undefined here, so just stagger the depth instead
      p = { x: clampFieldX(p.x), y: clampToLOS(p.y + 14) };
    } else {
      p = { x: clampFieldX(p.x + (dx/len)*14), y: clampToLOS(p.y + (dy/len)*14) };
    }
  }
  return p;
}

function motionFinalPosFor(g, motionType, idx){
  if(motionType !== 'jet' && motionType !== 'shift') return null;
  const pts = offensePoints(g.offKey, g.offCustom);
  const p = pts[idx];
  if(!p) return null;
  let raw;
  if(motionType === 'jet') raw = { x: 640 - p.x, y: p.y };
  else raw = { x: p.x + (p.x < 320 ? 45 : -45), y: p.y - 8 }; // shift
  raw.y = clampToLOS(raw.y);
  return resolveMotionCollision(raw, pts, idx);
}

function motionBendFor(motionType){
  return { jet:0.35, orbit:1.4, shift:0.25, return:1.7 }[motionType] || 0.5;
}

function computeMotionEndpoint(g, motionType, idx, startPt){
  if((motionType==='jet' || motionType==='shift') && g.motionType===motionType && g.motionFinalPos) return g.motionFinalPos;
  if(motionType==='jet' || motionType==='shift') return motionFinalPosFor(g, motionType, idx);
  if(motionType==='orbit') return { x: startPt.x + (startPt.x<320?40:-40), y: clampToLOS(startPt.y+15) };
  return { x: startPt.x, y: startPt.y }; // return: net zero displacement
}

function animateMotionMarker(startAbs, endAbs, bend, opts, ly){
  opts = opts || {};
  const duration = opts.duration || 900;
  const dyn = document.getElementById('dynamic');
  if(!dyn) return;

  const mid = { x:(startAbs.x+endAbs.x)/2, y:(startAbs.y+endAbs.y)/2 };
  const dx = endAbs.x-startAbs.x, dy = endAbs.y-startAbs.y;
  const len = Math.hypot(dx,dy) || 1;
  let perpX = -dy/len, perpY = dx/len;
  let control = { x: mid.x + perpX*90*bend, y: mid.y + perpY*90*bend };
  if(control.y < mid.y){
    // the bulge swung toward/past the line instead of deeper into the backfield \u2014 flip it
    perpX = -perpX; perpY = -perpY;
    control = { x: mid.x + perpX*90*bend, y: mid.y + perpY*90*bend };
  }
  if(ly != null) control.y = Math.max(control.y, ly + 4); // hard safety net: the arc can never visually cross the line

  if(opts.dotted){
    const oldPath = document.getElementById('motionPathDotted');
    if(oldPath) oldPath.remove();
    const path = el('path', {
      d: `M ${startAbs.x} ${startAbs.y} Q ${control.x} ${control.y} ${endAbs.x} ${endAbs.y}`,
      stroke:'var(--gold)', 'stroke-width':2, 'stroke-dasharray':'5,6', fill:'none', opacity:'0.8',
    });
    path.setAttribute('id','motionPathDotted');
    dyn.appendChild(path);
  }

  const old = document.getElementById('motionPreviewMarker');
  if(old) old.remove();
  const marker = makeMarker(startAbs.x, startAbs.y, 'X', 'var(--gold)', false, 0);
  marker.setAttribute('id','motionPreviewMarker');
  const lines = marker.querySelectorAll('line');
  const offsets = Array.from(lines).map(l=>({
    x1:parseFloat(l.getAttribute('x1')), y1:parseFloat(l.getAttribute('y1')),
    x2:parseFloat(l.getAttribute('x2')), y2:parseFloat(l.getAttribute('y2')),
  }));
  dyn.appendChild(marker);

  const t0 = performance.now();
  function frame(now){
    const t = Math.min((now-t0)/duration, 1);
    const pos = quadPoint(startAbs, control, endAbs, easeOutCubic(t));
    const ddx = pos.x-startAbs.x, ddy = pos.y-startAbs.y;
    lines.forEach((l,i)=> setAttrs(l, {
      x1:offsets[i].x1+ddx, y1:offsets[i].y1+ddy, x2:offsets[i].x2+ddx, y2:offsets[i].y2+ddy,
    }));
    if(t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function previewPlayRoutes(play){
  if(!game || !game.offKey) return;
  const ly = losY(game.ballOn);
  const dyn = document.getElementById('dynamic');
  if(!dyn) return;
  clearPlayRoutePreview();
  const endpoints = routeEndpointsFor(play, game.offKey, game.offCustom, ly);
  const group = el('g', {id:'playRoutePreview'});
  endpoints.forEach(({start,end})=>{
    group.appendChild(el('line', {x1:start.x,y1:start.y,x2:end.x,y2:end.y, stroke:'var(--gold)','stroke-width':2,'stroke-dasharray':'4,4', opacity:'0.85'}));
    group.appendChild(el('circle', {cx:end.x,cy:end.y,r:4, fill:'var(--gold)'}));
  });
  dyn.appendChild(group);
}
function clearPlayRoutePreview(){
  const old = document.getElementById('playRoutePreview');
  if(old) old.remove();
}

function previewMotionAnimation(motionType){
  if(!game || !game.offKey || !motionType) return;
  const ly = losY(game.ballOn);
  const idx = motionManIndex(game);
  const pts = offensePoints(game.offKey, game.offCustom);
  const p = pts[idx];
  if(!p) return;
  const startAbs = { x:p.x, y:ly+p.y };
  const endOffset = computeMotionEndpoint(game, motionType, idx, p);
  const endAbs = { x:endOffset.x, y: ly+endOffset.y };
  animateMotionMarker(startAbs, endAbs, motionBendFor(motionType), { duration:900, dotted:false }, ly);
}

function replayMotionForDefense(){
  if(!game || !game.motionType || !game.offKey || game.motionPlayerIndex==null) return;
  const ly = losY(game.ballOn);
  const idx = game.motionPlayerIndex;
  const pts = offensePoints(game.offKey, game.offCustom);
  const p = pts[idx];
  if(!p) return;
  const startAbs = { x:p.x, y:ly+p.y };
  const endOffset = computeMotionEndpoint(game, game.motionType, idx, p);
  const endAbs = { x:endOffset.x, y: ly+endOffset.y };
  animateMotionMarker(startAbs, endAbs, motionBendFor(game.motionType), { duration:2200, dotted:true }, ly);
}

function commitMotionChoice(g, motionType){
  g.motionType = motionType || null;
  if(g.motionType){
    g.motionPlayerIndex = motionManIndex(g);
    g.motionFinalPos = motionFinalPosFor(g, g.motionType, g.motionPlayerIndex);
  } else {
    g.motionPlayerIndex = null;
    g.motionFinalPos = null;
  }
}

function motionChoiceScreen(onChoose){
  const wrap = document.createElement('div');
  const p = document.createElement('div'); p.className = 'prompt';
  p.innerHTML = `<em>Pre-snap motion.</em> This is visible to the defence \u2014 they'll get a chance to adjust their front before the play is called.`;
  wrap.appendChild(p);
  const grid = document.createElement('div'); grid.className = 'choice-grid';
  const opts = [{key:'', label:'No Motion', note:'Stay in your set formation.'}]
    .concat(Object.keys(MOTION_TYPES).map(k=>({key:k, label:MOTION_TYPES[k], note:''})));
  opts.forEach(o=>{
    const btn = document.createElement('button'); btn.className = 'choice-btn';
    btn.innerHTML = `<span class="name">${o.label}</span><span class="desc">${o.note}</span>`;
    btn.addEventListener('mouseenter', ()=>{ if(o.key) previewMotionAnimation(o.key); });
    btn.onclick = ()=> onChoose(o.key || null);
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);
  return wrap;
}

function defAdjustScreen(onKeep, onChangeGrid){
  const wrap = document.createElement('div');
  const p = document.createElement('div'); p.className = 'prompt';
  p.innerHTML = `<em>The offence went in motion.</em> Adjust your front if you want to, or stay as you are.`;
  wrap.appendChild(p);
  const keepBtn = document.createElement('button'); keepBtn.className = 'create-new-btn';
  keepBtn.textContent = 'Keep current front';
  keepBtn.onclick = onKeep;
  wrap.appendChild(keepBtn);
  wrap.appendChild(onChangeGrid);
  return wrap;
}

function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }

function formatClock(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + (s<10?'0':'') + s;
}

/* ================= main render ================= */

let previewOverride = null; // { side:'offense'|'defense', key, custom } \u2014 hover-preview on the field
let formationHoverTimer = null;
let formationPreviewEndTimer = null;
function startFormationPreview(side, key, custom){ previewOverride = {side, key, custom}; render(); }
function endFormationPreview(){ if(previewOverride){ previewOverride = null; render(); } }

function render(){
  if(!game) return;
  const ly = losY(game.ballOn);
  const dyn = clearDynamic();

  drawLineMarker(dyn, ly, 'var(--chalk)', false);
  if(game.ballOn < 100){
    const distY = losY(Math.min(game.ballOn+game.distance,100));
    drawLineMarker(dyn, distY, 'var(--gold)', true);
  }

  if(previewOverride && previewOverride.side==='offense'){
    drawOffense(dyn, previewOverride.key, previewOverride.custom, ly, false);
  } else if(game.offKey){
    const motionOverride = (game.motionType && game.motionFinalPos)
      ? {index:game.motionPlayerIndex, pos:game.motionFinalPos} : null;
    drawOffense(dyn, game.offKey, game.offCustom, ly, false, motionOverride);
  }

  if(previewOverride && previewOverride.side==='defense'){
    drawDefense(dyn, previewOverride.key, previewOverride.custom, ly, false);
  } else if(game.defFrontKey) drawDefense(dyn, game.defFrontKey, game.defFrontCustom, ly, false);

  let animateThisResult = false;
  if(game.lastResult && game.seq !== lastAnimatedSeq){
    animateThisResult = true;
    lastAnimatedSeq = game.seq;
  }
  if(game.lastResult){
    drawPlayResult(dyn, ly, animateThisResult);
  }

  document.getElementById('downBug').innerHTML =
    `<b>${ordinal(game.down)} &amp; ${game.distance}</b><br>ball on ${Math.round(game.ballOn)}`
    + `<br>score: ${game.score}`
    + (game.clockOn ? `<br>Q${game.quarter} \u2014 ${formatClock(game.clock)}` : '');
  const roleBug = document.getElementById('roleBug');
  if(mode === 'local'){
    roleBug.className = 'role-bug';
    roleBug.innerHTML = `<b>local 2-player</b>`;
  } else {
    roleBug.className = 'role-bug' + (myRole==='defense' ? ' def' : '');
    roleBug.innerHTML = `playing <b>${myRole==='offense'?'Offence':'Defence'}</b>`;
  }

  renderCallout(animateThisResult);
  if(animateThisResult){
    // hold off on the panel/result box until the animation finishes
    const p = document.getElementById('panel');
    p.style.opacity = '0';
    requestAnimationFrame(()=>{ p.innerHTML=''; p.appendChild(note('Watching it unfold\u2026')); requestAnimationFrame(()=>{ p.style.opacity='1'; }); });
  } else {
    renderPanel();
  }
}

function renderCallout(animating){
  const callout = document.getElementById('phaseCallout');
  if(animating){ callout.textContent = "Snap."; return; }

  if(mode === 'local'){
    const map = {
      OFF_FORMATION: "Offence, set your formation.",
      DEF_FRONT:     "Defence, match it.",
      HANDOFF_TO_OFF:"Hand the device to the offence.",
      OFF_PLAY:      "Offence, make the call.",
      HANDOFF_TO_DEF:"Hand the device to the defence.",
      DEF_CALL:      "Defence, make the call.",
      RESULT:        game.lastResult && game.lastResult.touchdown ? "Touchdown!" : "Here's the read.",
    };
    callout.textContent = map[game.phase] || '';
    return;
  }

  const mineTurn = isMyTurn();
  const map = {
    OFF_FORMATION: mineTurn ? "Set your formation." : "Offence is setting their formation.",
    DEF_FRONT:     mineTurn ? "Match their formation." : "Defence is matching the formation.",
    OFF_PLAY:      mineTurn ? "Make your play call." : "Offence is making the call.",
    DEF_CALL:      mineTurn ? "Make your defensive call." : "Defence is making the call.",
    RESULT:        game.lastResult && game.lastResult.touchdown ? "Touchdown!" : "Here's the read.",
  };
  callout.textContent = map[game.phase] || '';
}

function isMyTurn(){
  const phase = game.phase;
  if(phase==='OFF_FORMATION' || phase==='OFF_PLAY') return myRole==='offense';
  if(phase==='DEF_FRONT' || phase==='DEF_CALL') return myRole==='defense';
  return false;
}

/* ================= panel ================= */

const panel = document.getElementById('panel');

function renderPanel(){
  panel.style.opacity = '0';
  requestAnimationFrame(()=> buildPanel());
}

function buildPanel(){
  panel.innerHTML = '';
  const phase = game.phase;

  if(editorOverlay){
    panel.appendChild(renderInlineEditor());
    requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
    return;
  }

  if(mode === 'local'){
    buildLocalPanel(phase);
    requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
    return;
  }

  if(mode === 'ai'){
    buildAIPanel(phase);
    requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
    return;
  }

  if(phase === 'OFF_FORMATION'){
    if(myRole==='offense'){
      if(game.down===4 && !game.fourthDownDecided){
        panel.appendChild(fourthDownChoiceBox());
      } else {
      panel.appendChild(choiceGrid(
        "Choose a formation \u2014 the defence will see it and line up across from you.", false,
        groupsByPersonnel(formations, customOffFormations, offPersonnelOf,
          k=>writeGame(g=>{ g.offKey=k; g.offCustom=null; g.phase='DEF_FRONT'; }),
          item=>writeGame(g=>{ g.offKey=CUSTOM; g.offCustom=item; g.phase='DEF_FRONT'; }), true),
        ()=> openEditor('offense','formation'), 'Create your own formation',
      null, null, 'offense'
      ));
      if(kneelAvailable(game)) panel.appendChild(kneelButton());
      }
    } else {
      panel.appendChild(waitingBox("Offence is choosing a formation\u2026"));
    }
  } else if(phase === 'DEF_FRONT'){
    if(myRole==='defense'){
      panel.appendChild(choiceGrid(
        "Choose a front to match the offence's personnel.", true,
        groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
          k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='OFF_MOTION'; }),
          item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='OFF_MOTION'; }), false),
        ()=> openEditor('defense','formation'), 'Create your own front',
      null, null, 'defense'
      ));
    } else {
      panel.appendChild(waitingBox("Defence is matching your formation\u2026"));
    }
  } else if(phase === 'OFF_MOTION'){
    if(myRole==='offense'){
      panel.appendChild(motionChoiceScreen(motionType=> writeGame(g=>{ commitMotionChoice(g, motionType); g.phase='DEF_ADJUST'; })));
    } else {
      panel.appendChild(waitingBox("Offence is deciding on motion\u2026"));
    }
  } else if(phase === 'DEF_ADJUST'){
    if(myRole==='defense'){
      replayMotionForDefense();
      const changeGrid = choiceGrid(
        "Or pick a different front.", true,
        groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
          k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='OFF_PLAY'; }),
          item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='OFF_PLAY'; }), false),
        null, null, null, null, 'defense'
      );
      panel.appendChild(defAdjustScreen(()=> writeGame(g=>{ g.phase='OFF_PLAY'; }), changeGrid));
    } else {
      panel.appendChild(waitingBox("Defence is reacting to the motion\u2026"));
    }
  } else if(phase === 'OFF_PLAY'){
    if(myRole==='offense'){
      const onPick = k=>writeGame(g=>{ g.offPlayKey=k; g.offPlayCustom=null; g.phase='DEF_CALL'; });
      const onPickCustom = item=>writeGame(g=>{ g.offPlayKey=CUSTOM; g.offPlayCustom=item; g.phase='DEF_CALL'; });
      panel.appendChild(choiceGrid(
        "Hidden from the defence \u2014 pick your play.", false,
        groupsByCategory(plays, customOffPlays, PLAY_CATEGORIES, onPick, onPickCustom, formationHasBack(game.offKey, game.offCustom)),
        ()=> openEditor('offense','play'), 'Create your own play',
        text=> handleTypedPlay(text, onPick, onPickCustom),
        offCoachTip(game.down, game.distance, game.ballOn),
        null, true
      ));
    } else {
      panel.appendChild(waitingBox("Offence is making their play call\u2026"));
    }
  } else if(phase === 'DEF_CALL'){
    if(myRole==='defense'){
      const onPick = k=>writeGame(g=>{ g.defCallKey=k; g.defCallCustom=null; resolvePlay(g); g.phase='RESULT'; });
      const onPickCustom = item=>writeGame(g=>{ g.defCallKey=CUSTOM; g.defCallCustom=item; resolvePlay(g); g.phase='RESULT'; });
      panel.appendChild(choiceGrid(
        "Hidden from the offence \u2014 make your call.", true,
        groupsByCategory(calls, customDefCalls, CALL_CATEGORIES, onPick, onPickCustom),
        ()=> openEditor('defense','play'), 'Create your own call',
        text=> handleTypedCall(text, onPick, onPickCustom),
        defCoachTip(game.down, game.distance, game.ballOn)
      ));
    } else {
      panel.appendChild(waitingBox("Defence is making their call\u2026"));
    }
  } else if(phase === 'RESULT'){
    panel.appendChild(resultBox());
  }

  requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
}

    }));

  } else if(phase === 'DEF_CALL'){
    const onPickDef = k=>writeGame(g=>{ g.defCallKey=k; g.defCallCustom=null; resolvePlay(g); g.phase='RESULT'; });
    const onPickDefCustom = item=>writeGame(g=>{ g.defCallKey=CUSTOM; g.defCallCustom=item; resolvePlay(g); g.phase='RESULT'; });
    panel.appendChild(choiceGrid(
      "Hidden from the offence \u2014 make your call.", true,
      groupsByCategory(calls, customDefCalls, CALL_CATEGORIES, onPickDef, onPickDefCustom),
      ()=> openEditor('defense','play'), 'Create your own call',
      text=> handleTypedCall(text, onPickDef, onPickDefCustom),
      defCoachTip(game.down, game.distance, game.ballOn)
    ));

  } else if(phase === 'RESULT'){
    panel.appendChild(resultBox());
  }
}

function buildAIPanel(phase){
  const isOffPhase = (phase==='OFF_FORMATION' || phase==='OFF_PLAY' || phase==='OFF_MOTION');
  const controllingSide = phase==='RESULT' ? null : (isOffPhase ? 'offense' : 'defense');
  const isHumanTurn = controllingSide === myRole;

  aiMaybeAct();

  if(controllingSide && !isHumanTurn){
    panel.appendChild(waitingBox("The AI is thinking\u2026"));
    return;
  }

  if(phase === 'OFF_FORMATION'){
    if(game.down===4 && !game.fourthDownDecided){
      panel.appendChild(fourthDownChoiceBox());
      return;
    }
    panel.appendChild(choiceGrid(
      "Choose a formation \u2014 the defence will see it and line up across from you.", false,
      groupsByPersonnel(formations, customOffFormations, offPersonnelOf,
        k=>writeGame(g=>{ g.offKey=k; g.offCustom=null; g.phase='DEF_FRONT'; }),
        item=>writeGame(g=>{ g.offKey=CUSTOM; g.offCustom=item; g.phase='DEF_FRONT'; }), true),
      ()=> openEditor('offense','formation'), 'Create your own formation',
    null, null, 'offense'
    ));
    if(kneelAvailable(game)) panel.appendChild(kneelButton());

  } else if(phase === 'DEF_FRONT'){
    panel.appendChild(choiceGrid(
      "Choose a front to match the offence's personnel.", true,
      groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
        k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='OFF_MOTION'; }),
        item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='OFF_MOTION'; }), false),
      ()=> openEditor('defense','formation'), 'Create your own front',
    null, null, 'defense'
    ));

  } else if(phase === 'OFF_MOTION'){
    panel.appendChild(motionChoiceScreen(motionType=> writeGame(g=>{ commitMotionChoice(g, motionType); g.phase='DEF_ADJUST'; })));

  } else if(phase === 'DEF_ADJUST'){
    replayMotionForDefense();
    const changeGrid = choiceGrid(
      "Or pick a different front.", true,
      groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
        k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='OFF_PLAY'; }),
        item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='OFF_PLAY'; }), false),
      null, null, null, null, 'defense'
    );
    panel.appendChild(defAdjustScreen(()=> writeGame(g=>{ g.phase='OFF_PLAY'; }), changeGrid));

  } else if(phase === 'OFF_PLAY'){
    const onPick = k=>writeGame(g=>{ g.offPlayKey=k; g.offPlayCustom=null; g.phase='DEF_CALL'; });
    const onPickCustom = item=>writeGame(g=>{ g.offPlayKey=CUSTOM; g.offPlayCustom=item; g.phase='DEF_CALL'; });
    panel.appendChild(choiceGrid(
      "Pick your play.", false,
      groupsByCategory(plays, customOffPlays, PLAY_CATEGORIES, onPick, onPickCustom, formationHasBack(game.offKey, game.offCustom)),
      ()=> openEditor('offense','play'), 'Create your own play',
      text=> handleTypedPlay(text, onPick, onPickCustom),
      offCoachTip(game.down, game.distance, game.ballOn),
      null, true
    ));

  } else if(phase === 'DEF_CALL'){
    const onPick = k=>writeGame(g=>{ g.defCallKey=k; g.defCallCustom=null; resolvePlay(g); g.phase='RESULT'; });
    const onPickCustom = item=>writeGame(g=>{ g.defCallKey=CUSTOM; g.defCallCustom=item; resolvePlay(g); g.phase='RESULT'; });
    panel.appendChild(choiceGrid(
      "Make your defensive call.", true,
      groupsByCategory(calls, customDefCalls, CALL_CATEGORIES, onPick, onPickCustom),
      ()=> openEditor('defense','play'), 'Create your own call',
      text=> handleTypedCall(text, onPick, onPickCustom),
      defCoachTip(game.down, game.distance, game.ballOn)
    ));

  } else if(phase === 'RESULT'){
    panel.appendChild(resultBox());
  }
}

function aiMaybeAct(){
  if(mode !== 'ai' || !game || game.phase === 'RESULT') return;
  const phase = game.phase;
  const side = (phase==='OFF_FORMATION'||phase==='OFF_PLAY'||phase==='OFF_MOTION') ? 'offense'
    : (phase==='DEF_FRONT'||phase==='DEF_CALL'||phase==='DEF_ADJUST') ? 'defense' : null;
  if(side !== game.aiSide) return;
  if(aiPending) return;
  aiPending = true;

  setTimeout(()=>{
    aiPending = false;
    if(mode!=='ai' || game.phase!==phase) return; // stale timer guard
    if(phase==='OFF_FORMATION' && game.down===4 && !game.fourthDownDecided){
      const choice = aiPickFourthDownChoice(game.distance, game.ballOn, game.aiOffStyle);
      writeGame(g=>{
        if(choice==='punt'){ resolvePunt(g); g.phase='RESULT'; return; }
        if(choice==='fg'){ resolveFieldGoal(g); g.phase='RESULT'; return; }
        g.fourthDownDecided = true;
        const pick = aiPickFormation(g.down, g.distance);
        if(pick.isCustom){ g.offKey=CUSTOM; g.offCustom=pick.item; } else { g.offKey=pick.key; g.offCustom=null; }
        g.phase='DEF_FRONT';
      });
      return;
    }
    if(phase==='OFF_FORMATION'){
      writeGame(g=>{
        const pick = aiPickFormation(g.down, g.distance);
        if(pick.isCustom){ g.offKey=CUSTOM; g.offCustom=pick.item; } else { g.offKey=pick.key; g.offCustom=null; }
        g.phase='DEF_FRONT';
      });
    } else if(phase==='DEF_FRONT'){
      writeGame(g=>{
        const pick = aiPickFront();
        g.defFrontKey = pick.key; g.defFrontCustom = null;
        g.phase='OFF_MOTION';
      });
    } else if(phase==='OFF_MOTION'){
      writeGame(g=>{
        // scout what it's likely to call, and signal jet motion if that leans sweep/reverse
        const preview = aiPickPlay(g.down, g.distance, g.ballOn, g.aiDifficulty, g.aiOffStyle, formationHasBack(g.offKey, g.offCustom));
        const wantsJet = !preview.isCustom && (preview.key==='sweep' || preview.key==='reverse');
        commitMotionChoice(g, wantsJet ? 'jet' : null);
        g.phase='DEF_ADJUST';
      });
    } else if(phase==='DEF_ADJUST'){
      writeGame(g=>{ g.phase='OFF_PLAY'; }); // AI keeps its front; nothing mechanical to gain from changing it
    } else if(phase==='OFF_PLAY'){
      writeGame(g=>{
        const pick = aiPickPlay(g.down, g.distance, g.ballOn, g.aiDifficulty, g.aiOffStyle, formationHasBack(g.offKey, g.offCustom));
        if(pick.isCustom){ g.offPlayKey=CUSTOM; g.offPlayCustom=pick.item; } else { g.offPlayKey=pick.key; g.offPlayCustom=null; }
        g.phase='DEF_CALL';
      });
    } else if(phase==='DEF_CALL'){
      writeGame(g=>{
        const pick = aiPickCall(g.down, g.distance, g.ballOn, g.aiDifficulty, g.aiDefStyle);
        if(pick.isCustom){ g.defCallKey=CUSTOM; g.defCallCustom=pick.item; } else { g.defCallKey=pick.key; g.defCallCustom=null; }
        resolvePlay(g);
        g.phase='RESULT';
      });
    }
  }, 700);
}

function computeOffPersonnel(skillArr){
  let backs=0, tes=0;
  skillArr.forEach(p=>{ if(p.label==='TE') tes++; else if(p.label==='RB'||p.label==='FB'||p.label==='HB') backs++; });
  return `${backs}${tes}`;
}
function offPersonnelOf(key, item, isCustom){
  return isCustom ? (item.personnel || '11') : computeOffPersonnel(item.skill);
}
function defPersonnelOf(key, item, isCustom){
  let dl=0, lb=0;
  item.players.forEach(p=>{ if(p.role==='DL') dl++; else if(p.role==='LB') lb++; });
  return `${dl}-${lb}`;
}

function groupsByCategory(builtinDict, customList, categoryMap, onPick, onPickCustom, formHasBack){
  return Object.keys(categoryMap).map(catKey=>{
    const entries=[];
    Object.keys(builtinDict).forEach(k=>{
      if(builtinDict[k].category!==catKey) return;
      const blocked = builtinDict[k].needsBack && formHasBack===false;
      entries.push({
        item:builtinDict[k], isCustom:false, key:k,
        onClick: blocked ? null : ()=>onPick(k),
        disabled: blocked,
        disabledReason: blocked ? "Needs a running back in your formation" : null,
      });
    });
    (customList||[]).forEach(item=>{ if(item.category===catKey) entries.push({item,isCustom:true,key:item.id,onClick:()=>onPickCustom(item)}); });
    return {heading:categoryMap[catKey], entries};
  }).filter(g=>g.entries.length);
}

let formationFlipActive = false;

function buildFlippedFormation(isOffenseSide, key, item, isCustom){
  const pts = isOffenseSide
    ? offensePoints(isCustom?CUSTOM:key, isCustom?item:null)
    : defensePoints(isCustom?CUSTOM:key, isCustom?item:null);
  const flipped = pts.map(p=> isOffenseSide ? {x:640-p.x, y:p.y} : {x:640-p.x, y:p.y, role:p.role});
  const result = { id:'flip_'+genId(), name: item.name + ' (flipped)', players: flipped, note: item.note };
  if(isOffenseSide) result.personnel = isCustom ? (item.personnel||'11') : computeOffPersonnel(item.skill);
  return result;
}

function groupsByPersonnel(builtinDict, customList, personnelFn, onPick, onPickCustom, isOffenseSide){
  const map = {};
  Object.keys(builtinDict).forEach(k=>{
    const label = personnelFn(k,builtinDict[k],false);
    (map[label] = map[label]||[]).push({item:builtinDict[k],isCustom:false,key:k,onClick:()=>{
      if(formationFlipActive) onPickCustom(buildFlippedFormation(isOffenseSide, k, builtinDict[k], false));
      else onPick(k);
    }});
  });
  (customList||[]).forEach(item=>{
    const label = personnelFn(item.id,item,true);
    (map[label] = map[label]||[]).push({item,isCustom:true,key:item.id,onClick:()=>{
      if(formationFlipActive) onPickCustom(buildFlippedFormation(isOffenseSide, item.id, item, true));
      else onPickCustom(item);
    }});
  });
  return Object.keys(map).sort().map(label=>({heading:label+' personnel', entries:map[label]}));
}
