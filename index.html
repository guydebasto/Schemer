function consumeClock(g, stopsClock){
  if(!g.clockOn || g.gameOver) return;
  const playDuration = 6;
  const runoff = stopsClock ? 0 : 38;
  let total = playDuration + runoff;
  const before = g.clock;
  g.clock -= total;
  if((g.quarter===2||g.quarter===4) && !g.twoMinuteWarningGiven && before >= 120 && g.clock < 120){
    g.clock = 120;
    g.twoMinuteWarningGiven = true;
  }
  if(g.clock <= 0){
    g.clock = 0;
    if(g.quarter < 4){
      g.quarter += 1;
      g.clock = 900;
      g.twoMinuteWarningGiven = false;
    } else {
      g.gameOver = true;
    }
  }
}

function resolvePlay(g){
  const o = computeOutcome(g);
  const playObj = getPlay(g.offPlayKey, g.offPlayCustom);
  let yards = o.yards;
  let touchdown = false, driveOver = false;

  let motionBonusText = '';
  if(g.motionType==='jet' && (g.offPlayKey==='sweep' || g.offPlayKey==='reverse') && !o.breakaway){
    yards += 3;
    motionBonusText = ' The jet motion sold it \u2014 an extra push outside.';
  }

  if(o.breakaway){
    yards = 100 - g.ballOn;
    touchdown = true; driveOver = true;
  } else {
    const newBallOn = g.ballOn + yards;
    if(newBallOn >= 100){
      touchdown = true; driveOver = true;
      yards = 100 - g.ballOn;
    } else if(yards >= g.distance){
      g.ballOn = newBallOn;
      g.down = 1; g.distance = Math.min(10, 100-newBallOn);
    } else {
      g.ballOn = newBallOn;
      g.down += 1; g.distance -= yards;
      if(g.distance < 1) g.distance = 1;
      if(g.down > 4){ driveOver = true; }
    }
  }

  if(touchdown) g.score += 7;
  if(driveOver){ g.ballOn = 25; g.down = 1; g.distance = 10; }

  const stopsClock = touchdown
    || (yards <= 0 && (playObj.category==='pass'||playObj.category==='deep'||playObj.category==='playAction'))
    || (yards >= 15 && Math.random() < 0.4);
  consumeClock(g, stopsClock);

  g.lastResult = { yards, text:o.text+motionBonusText, role:o.role, touchdown, driveOver };
  if(o.breakaway && touchdown) g.lastResult.text += " Nobody's catching him \u2014 touchdown!";
  if(driveOver && !touchdown) g.lastResult.text += " Turnover on downs \u2014 fresh drive.";
}

function resolvePunt(g){
  g.lastResult = { yards:0, text:"The punt team trots out \u2014 fresh start for the defence.", role:null, touchdown:false, driveOver:true, special:true };
  g.ballOn = 25; g.down = 1; g.distance = 10;
  consumeClock(g, true);
}

function resolveFieldGoal(g){
  const kickDistance = (100 - g.ballOn) + 17;
  let chance;
  if(kickDistance<=30) chance=0.98;
  else if(kickDistance<=40) chance=0.90;
  else if(kickDistance<=50) chance=0.75;
  else if(kickDistance<=55) chance=0.55;
  else if(kickDistance<=60) chance=0.30;
  else chance=0.10;
  const made = Math.random() < chance;
  if(made) g.score += 3;
  g.lastResult = { yards:0, text: made
    ? `The ${kickDistance}-yard field goal attempt is good!`
    : `The ${kickDistance}-yard field goal attempt is no good.`,
    role:null, touchdown:false, driveOver:true, special:true, fieldGoalMade:made };
  g.ballOn = 25; g.down = 1; g.distance = 10;
  consumeClock(g, true);
}

function resolveKneel(g){
  g.lastResult = { yards:-1, text:"Quarterback takes a knee \u2014 running the clock down.", role:null, touchdown:false, driveOver:false, special:true };
  g.ballOn = Math.max(0, g.ballOn - 1);
  g.down += 1; g.distance += 1;
  if(g.down > 4){ g.down=1; g.distance=10; g.ballOn=25; g.lastResult.driveOver=true; }
  consumeClock(g, false);
}

function aiPickFourthDownChoice(distance, ballOn, styleKey){
  const style = OFF_PLAYSTYLES[styleKey] || OFF_PLAYSTYLES.balanced;
  const boldness = (style.weights.deep + style.weights.playAction) / 2;
  const fgRange = ballOn >= 60;
  let goForItChance = (distance <= 2 ? 0.6 : 0.15) * (0.6 + boldness*0.4);
  goForItChance = Math.min(0.9, goForItChance);
  if(Math.random() < goForItChance) return 'goForIt';
  return fgRange ? 'fg' : 'punt';
}

function kneelAvailable(g){
  return g.clockOn && (g.quarter===2 || g.quarter===4) && g.clock <= 120 && !g.gameOver;
}

}

function fourthDownChoiceBox(){
  const wrap = document.createElement('div');

  wrap.appendChild(p);

    const kickDist = (100-game.ballOn)+17;
    const fgBtn = document.createElement('button'); fgBtn.className='choice-btn';
    fgBtn.innerHTML = `<span class="name">Kick a field goal</span><span class="desc">${kickDist}-yard attempt \u2014 worth 3 points if it's good.</span>`;
    fgBtn.onclick = ()=> writeGame(g=>{ resolveFieldGoal(g); g.phase='RESULT'; });
    grid.appendChild(fgBtn);
  }
  wrap.appendChild(grid);
  return wrap;
}

const EDITOR_LOS_Y = 480;
let ed = { side:'offense', type:'formation', points:[], backdropKey:'singleback', arrowEnd:{x:380,y:EDITOR_LOS_Y-90}, category:'run', editingId:null };

function edInit(){
  ed = { side:'offense', type:'formation', points:[], backdropKey:'singleback',
    arrowEnd:{x:380,y:EDITOR_LOS_Y-90}, category:'run', personnel:'11', editingId:null,
    ghostOn:false, ghostKey:'base43', routes:{} };
  ed.points = edDefaultPoints('offense');
}

function edDefaultPoints(side){
  if(side==='offense') return offensePoints('singleback', null).map(p=>({x:p.x, y:EDITOR_LOS_Y+p.y}));
  return defensePoints('base43', null).map(p=>({x:p.x, y:EDITOR_LOS_Y+p.y, role:p.role}));
}

function roleForDepth(y){
  const upfield = EDITOR_LOS_Y - y;
  if(upfield < 20) return 'DL';
  if(upfield < 55) return 'LB';
  if(upfield < 85) return 'CB';
  return 'S';
}

function edSwitchSide(side){
  ed.side = side; ed.editingId = null; ed.routes = {};
  ed.ghostKey = side==='offense' ? 'base43' : 'singleback';
  if(ed.type==='formation'){ ed.points = edDefaultPoints(side); ed.personnel='11'; }
  else { ed.category = side==='offense'?'run':'runD'; ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.backdropKey = side==='offense'?'singleback':'base43'; }
  renderEditorScreen();
}
function edSwitchType(type){
  ed.type = type; ed.editingId = null; ed.routes = {};
  if(type==='formation'){ ed.points = edDefaultPoints(ed.side); }
  else { ed.category = ed.side==='offense'?'run':'runD'; ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.backdropKey = ed.side==='offense'?'singleback':'base43'; }
  renderEditorScreen();
}
function edCategoryPick(cat){ ed.category = cat; renderEditorScreen(); }
function edBackdropChange(key){ ed.backdropKey = key; edRenderCanvas(); }

function edLoadExisting(value, inline){
  ed.editingId = null; ed.routes = {};
  const isOff = ed.side==='offense';
  const done = ()=> inline ? renderPanel() : renderEditorScreen();
  if(!value){
    if(ed.type==='formation'){ ed.points = edDefaultPoints(ed.side); ed.personnel='11'; }
    else { ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.category = isOff?'run':'runD'; }
    done(); return;
  }
  if(value.startsWith('built:')){
    const key = value.slice(6);
    if(ed.type==='formation'){
      if(isOff){
        ed.points = offensePoints(key,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}));
        ed.personnel = computeOffPersonnel(formations[key].skill);
      } else {
        ed.points = defensePoints(key,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      }
    } else {
      const src = isOff ? plays[key] : calls[key];
      ed.category = src.category;
      ed.arrowEnd = isOff ? { x:src.xTarget, y: EDITOR_LOS_Y - (src.bend*180+30) } : {x:380,y:EDITOR_LOS_Y-90};
    }
    done(); return;
  }
  const id = value.slice(7);
  if(ed.type==='formation'){
    const list = isOff?customOffFormations:customDefFormations;
    const item = list.find(x=>x.id===id);
    if(item){
      ed.editingId=id; ed.points = item.players.map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      if(isOff) ed.personnel = item.personnel || '11';
    }
  } else {
    const list = isOff?customOffPlays:customDefCalls;
    const item = list.find(x=>x.id===id);
    if(item){
      ed.editingId=id; ed.category=item.category;
      ed.arrowEnd = isOff ? { x:item.xTarget, y: EDITOR_LOS_Y - (item.bend*180+30) } : (item.arrowEnd || {x:380,y:EDITOR_LOS_Y-90});
      ed.routes = item.routes || {};
    }
  }
  done();
}

function edFlip(){
  if(ed.type==='formation'){ ed.points = ed.points.map(p=> ({...p, x: 640-p.x})); }
  else { ed.arrowEnd = {...ed.arrowEnd, x: 640-ed.arrowEnd.x}; }
  edRenderCanvas();
}

const PERSONNEL_OPTIONS = ['00','01','02','10','11','12','13','20','21','22','23','31','32'];
function ghostControlsHtml(){

function personnelSelectHtml(selected){

const LINE_TOLERANCE = 3; // px slack for "on the line of scrimmage"

async function edPersist(){
  const nameInput = document.getElementById('edName');
  const name = (nameInput && nameInput.value.trim()) || 'Untitled';
  const isOff = ed.side==='offense';
  let ok = true;
  if(ed.type==='formation'){
    if(isOff){
      const backfieldCount = ed.points.filter(p => (p.y - EDITOR_LOS_Y) > LINE_TOLERANCE).length;
      if(backfieldCount > 4){
        alert(`Only 4 players are allowed off the line of scrimmage \u2014 you've got ${backfieldCount} back there. Bring ${backfieldCount-4} of them up to the line before saving.`);
        return false;
      }
    }
    const players = ed.points.map(p=> isOff
      ? {x:Math.round(p.x), y:Math.round(p.y-EDITOR_LOS_Y)}
      : {x:Math.round(p.x), y:Math.round(p.y-EDITOR_LOS_Y), role: roleForDepth(p.y), customLabel: p.customLabel||null});
    const item = { id: ed.editingId || genId(), name, players };
    if(isOff){
      const personnelInput = document.getElementById('edPersonnel');
      item.personnel = (personnelInput && personnelInput.value) || '11';
    }
    const key = isOff ? CUSTOM_STORE_KEYS.offForm : CUSTOM_STORE_KEYS.defForm;
    let list = (isOff ? customOffFormations : customDefFormations).filter(x=>x.id!==item.id);
    list.push(item);
    if(isOff) customOffFormations = list; else customDefFormations = list;
    ok = await saveCustomList(key, list);
  } else if(isOff){
    const dx = ed.arrowEnd.x - 320;
    const bend = Math.max(0.1, Math.min(0.9, Math.abs(dx)/300));
    const item = { id: ed.editingId || genId(), name, category: ed.category,
      note: "A play you designed.", xTarget: Math.round(ed.arrowEnd.x), bend };
    if(ed.routes && Object.keys(ed.routes).length) item.routes = ed.routes;
    let list = customOffPlays.filter(x=>x.id!==item.id); list.push(item);
    customOffPlays = list;
    ok = await saveCustomList(CUSTOM_STORE_KEYS.offPlay, list);
  } else {
    const item = { id: ed.editingId || genId(), name, category: ed.category,
      note: "A call you designed.", arrowEnd: {x:Math.round(ed.arrowEnd.x), y:Math.round(ed.arrowEnd.y)} };
    let list = customDefCalls.filter(x=>x.id!==item.id); list.push(item);
    customDefCalls = list;
    ok = await saveCustomList(CUSTOM_STORE_KEYS.defCall, list);
  }
  if(!ok){
    alert("That didn't save \u2014 your browser is blocking local storage here (this can happen in private/incognito mode, or if you're opening the file directly instead of the live website). Try the live site in a normal browser window.");
    return false;
  }
  alert('Saved.');
  return true;
}

async function removeCustomItem(kind, id){
  if(kind==='offForm'){ customOffFormations = customOffFormations.filter(x=>x.id!==id); await saveCustomList(CUSTOM_STORE_KEYS.offForm, customOffFormations); }
  else if(kind==='defForm'){ customDefFormations = customDefFormations.filter(x=>x.id!==id); await saveCustomList(CUSTOM_STORE_KEYS.defForm, customDefFormations); }
  else if(kind==='offPlay'){ customOffPlays = customOffPlays.filter(x=>x.id!==id); await saveCustomList(CUSTOM_STORE_KEYS.offPlay, customOffPlays); }
  else if(kind==='defCall'){ customDefCalls = customDefCalls.filter(x=>x.id!==id); await saveCustomList(CUSTOM_STORE_KEYS.defCall, customDefCalls); }
}

async function edPersistDelete(){
  if(!ed.editingId) return;
  const isOff = ed.side==='offense';
  if(ed.type==='formation'){
    if(isOff){ customOffFormations = customOffFormations.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.offForm, customOffFormations); }
    else { customDefFormations = customDefFormations.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.defForm, customDefFormations); }
  } else if(isOff){
    customOffPlays = customOffPlays.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.offPlay, customOffPlays);
  } else {
    customDefCalls = customDefCalls.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.defCall, customDefCalls);
  }
}

        const rm = document.createElement('button');

          if(confirm(`Remove "${item.name}"? This can't be undone.`)){

}

function edSvgPoint(evt, svg){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if(!ctm) return {x:320,y:400};
  const loc = pt.matrixTransform(ctm.inverse());
  return { x: Math.max(45,Math.min(595,loc.x)), y: Math.max(15,Math.min(745,loc.y)) };
}

function edStartDragPoint(evt, i, svg){
  evt.preventDefault();
  const startP = edSvgPoint(evt, svg);
  const orig = ed.points[i];
  const offX = orig.x - startP.x, offY = orig.y - startP.y;
  let moved = false;
  const move = e=>{
    const p = edSvgPoint(e, svg);
    const nx = p.x+offX;
    let ny = p.y+offY;
    if(Math.abs(nx-orig.x) > 3 || Math.abs(ny-orig.y) > 3) moved = true;
    // genuine rule: nobody may line up across the line of scrimmage before the snap
    ny = ed.side==='offense' ? Math.max(ny, EDITOR_LOS_Y) : Math.min(ny, EDITOR_LOS_Y);
    ed.points[i] = ed.side==='defense'
      ? {...ed.points[i], x:nx, y:ny, role: roleForDepth(ny)}
      : {...ed.points[i], x:nx, y:ny};
    edRenderCanvas();
  };
  const up = ()=>{
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    if(!moved && ed.side==='defense') handleDefenderClick(i);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

let defenderClickTracker = { index:null, count:0, timer:null };
function handleDefenderClick(i){
  if(defenderClickTracker.index !== i){ defenderClickTracker.index = i; defenderClickTracker.count = 0; }
  defenderClickTracker.count++;
  clearTimeout(defenderClickTracker.timer);
  defenderClickTracker.timer = setTimeout(()=>{ defenderClickTracker.count=0; defenderClickTracker.index=null; }, 1500);
  if(defenderClickTracker.count >= 3){
    defenderClickTracker.count = 0; defenderClickTracker.index = null;
    clearTimeout(defenderClickTracker.timer);
    const current = ed.points[i].customLabel || '';
    const input = prompt('Label this position (up to 4 letters):', current);
    if(input !== null){
      const clean = input.trim().toUpperCase().slice(0,4);
      ed.points[i] = {...ed.points[i], customLabel: clean || null};
      edRenderCanvas();
    }
  }
}

function edStartDragArrow(evt, svg){
  evt.preventDefault();
  const move = e=>{ ed.arrowEnd = edSvgPoint(e, svg); edRenderCanvas(); };
  const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function edStartRouteDraw(evt, idx, svg, startPt){
  evt.preventDefault();
  ed.routes = ed.routes || {};
  const move = e=>{
    const p = edSvgPoint(e, svg);
    ed.routes[idx] = { dx: p.x - startPt.x, dy: p.y - startPt.y };
    edRenderCanvas();
  };
  const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function edDraggableMarker(svg, x, y, shape, color, labelText, onDown){
  const g = el('g',{});
  const visual = labelText ? makeLabelMarker(x, y, labelText, color, false, 0) : makeMarker(x, y, shape, color, false, 0);
  visual.style.pointerEvents = 'none';
  g.appendChild(visual);
  const hit = el('circle',{cx:x,cy:y,r:17,fill:'transparent'});
  hit.style.cursor='grab';
  hit.addEventListener('pointerdown', onDown);
  g.appendChild(hit);
  return g;
}

function edRenderCanvas(){
  const svg = document.getElementById('edSvg');
  if(!svg) return;
  svg.innerHTML = '';
  svg.appendChild(el('rect',{x:0,y:0,width:640,height:760,fill:'var(--board)'}));
  svg.appendChild(el('line',{x1:40,y1:EDITOR_LOS_Y,x2:600,y2:EDITOR_LOS_Y,stroke:'var(--chalk-dim)','stroke-width':1,'stroke-dasharray':'4,4'}));
  const isOff = ed.side==='offense';

  if(ed.type==='formation' && ed.ghostOn){
    let ghostPts = [];
    try{
      if(String(ed.ghostKey).startsWith('custom:')){
        const id = ed.ghostKey.slice(7);
        const list = isOff ? customDefFormations : customOffFormations;
        const item = list.find(x=>x.id===id);
        if(item) ghostPts = item.players.map(p=>({x:p.x, y:EDITOR_LOS_Y+p.y}));
      } else {
        ghostPts = isOff ? defensePoints(ed.ghostKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}))
                          : offensePoints(ed.ghostKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}));
      }
    }catch(e){ ghostPts = []; }
    ghostPts.forEach((p,i)=>{
      const shape = isOff ? 'O' : (i===2 ? 'square' : 'X');
      const color = isOff ? 'var(--brick)' : 'var(--gold)';
      const g = makeMarker(p.x, p.y, shape, color, false, 0);
      g.style.opacity = '0.28';
      svg.appendChild(g);
    });
  }

  if(ed.type==='formation'){
    const labels = (!isOff && showPosLabels) ? computePositionLabels(ed.points) : null;
    ed.points.forEach((p,i)=>{
      const shape = isOff ? (i===2 ? 'square' : 'X') : 'O';
      const color = isOff ? 'var(--gold)' : 'var(--brick)';
      svg.appendChild(edDraggableMarker(svg, p.x, p.y, shape, color, labels?labels[i]:null, e=> edStartDragPoint(e, i, svg)));
    });
  } else {
    let backdropPts = [];
    try{
      if(String(ed.backdropKey).startsWith('custom:')){
        const id = ed.backdropKey.slice(7);
        const list = isOff?customOffFormations:customDefFormations;
        const item = list.find(x=>x.id===id);
        if(item) backdropPts = item.players.map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      } else {
        backdropPts = isOff ? offensePoints(ed.backdropKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}))
                             : defensePoints(ed.backdropKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      }
    }catch(e){ backdropPts = []; }
    const backdropLabels = (!isOff && showPosLabels) ? computePositionLabels(backdropPts) : null;
    backdropPts.forEach((p,i)=>{
      if(backdropLabels){
        const g = makeLabelMarker(p.x,p.y, backdropLabels[i]||'?', 'var(--brick-dim)', false, 0);
        g.style.opacity='0.55';
        svg.appendChild(g);
      } else {
        const shape = isOff ? (i===2 ? 'square' : 'X') : 'O';
        const g = makeMarker(p.x,p.y, shape, isOff?'var(--gold-dim)':'var(--brick-dim)', false, 0);
        g.style.opacity='0.55';
        svg.appendChild(g);
      }
      if(isOff && i>=5){
        if(!ed.routes || !ed.routes[i]){
          const ring = el('circle',{cx:p.x,cy:p.y,r:11,fill:'none',stroke:'var(--gold-dim)','stroke-width':1.5,'stroke-dasharray':'2,2'});
          ring.style.pointerEvents = 'none';
          svg.appendChild(ring);
        }
        const hit = el('circle',{cx:p.x,cy:p.y,r:15,fill:'transparent'});
        hit.style.cursor='crosshair';
        hit.addEventListener('pointerdown', e=> edStartRouteDraw(e, i, svg, p));
        svg.appendChild(hit);
      }
    });
    Object.keys(ed.routes||{}).forEach(idxStr=>{
      const idx = +idxStr;
      const p = backdropPts[idx];
      const r = ed.routes[idx];
      if(!p || !r) return;
      const end = { x: p.x + r.dx, y: p.y + r.dy };
      svg.appendChild(el('line',{x1:p.x,y1:p.y,x2:end.x,y2:end.y,stroke:'var(--gold)','stroke-width':2,'stroke-dasharray':'3,3'}));
      svg.appendChild(el('circle',{cx:end.x,cy:end.y,r:5,fill:'var(--gold)'}));
    });

    const ballX=320, ballY=EDITOR_LOS_Y;
    const ballColor = isOff ? 'var(--gold)' : 'var(--brick)';
    svg.appendChild(el('line',{x1:ballX,y1:ballY,x2:ed.arrowEnd.x,y2:ed.arrowEnd.y,stroke:ballColor,'stroke-width':3}));
    const ang = Math.atan2(ed.arrowEnd.y-ballY, ed.arrowEnd.x-ballX);
    const ah = 10;
    svg.appendChild(el('line',{x1:ed.arrowEnd.x,y1:ed.arrowEnd.y,x2:ed.arrowEnd.x-ah*Math.cos(ang-0.4),y2:ed.arrowEnd.y-ah*Math.sin(ang-0.4),stroke:ballColor,'stroke-width':3}));
    svg.appendChild(el('line',{x1:ed.arrowEnd.x,y1:ed.arrowEnd.y,x2:ed.arrowEnd.x-ah*Math.cos(ang+0.4),y2:ed.arrowEnd.y-ah*Math.sin(ang+0.4),stroke:ballColor,'stroke-width':3}));

    svg.appendChild(el('circle',{cx:ballX,cy:ballY,r:10,fill:ballColor,stroke:'var(--chalk)','stroke-width':1.5}));
    svg.appendChild(el('circle',{cx:ed.arrowEnd.x,cy:ed.arrowEnd.y,r:8,fill:'none',stroke:ballColor,'stroke-width':2}));
    const endHit = el('circle',{cx:ed.arrowEnd.x,cy:ed.arrowEnd.y,r:17,fill:'transparent'});
    endHit.style.cursor='grab';
    endHit.addEventListener('pointerdown', e=> edStartDragArrow(e, svg));
    svg.appendChild(endHit);
  }
}

/* ================= wire up footer + boot ================= */

document.getElementById('restartLink').onclick = ()=>{
  writeGame(g=>{
    Object.assign(g, freshGame());
  });
};
document.getElementById('leaveLink').onclick = leaveGame;
document.getElementById('posToggle').onclick = ()=>{
  showPosLabels = !showPosLabels;
  document.getElementById('posToggle').classList.toggle('on', showPosLabels);
  refreshCurrentView();
};
document.querySelectorAll('.topnav button').forEach(b=> b.onclick = ()=> goToScreen(b.dataset.nav));

(async function boot(){
  await loadAllCustom();
  const resumed = await tryResumeSession();
  if(!resumed){ appScreen = 'home'; renderLobby(); }
  updateNavActive();
})();
</script>
