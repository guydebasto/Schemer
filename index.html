<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schemer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-dark:#0F241D;
    --board:#1B4332;
    --board-line:#2F5C4C;
    --chalk:#F4F1E8;
    --chalk-dim:#B9C7BE;
    --gold:#E8C468;
    --gold-dim:#8a7a49;
    --brick:#C1503F;
    --brick-dim:#7a3931;
    --hash:#3f6a58;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-dark);color:var(--chalk);font-family:'Space Grotesk',sans-serif;}
  .app{max-width:720px;margin:0 auto;padding:18px 16px 40px;}

  .masthead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:12px;}
  .masthead h1{font-size:22px;font-weight:700;margin:0;letter-spacing:0.2px;}
  .masthead .tag{font-size:12px;color:var(--chalk-dim);text-align:right;line-height:1.4;cursor:default;}

  .field-wrap{position:relative;width:100%;border:1px solid var(--board-line);border-radius:2px;overflow:hidden;background:var(--board);}
  svg#field{display:block;width:100%;height:auto;}

  .down-bug{
    position:absolute; top:10px; left:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    padding:6px 10px;
    font-size:13px;
    line-height:1.5;
  }
  .down-bug b{color:var(--gold);}

  .role-bug{
    position:absolute; top:10px; right:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    padding:6px 10px;
    font-size:12px;
    line-height:1.5;
    text-align:right;
  }
  .role-bug b{color:var(--gold);}
  .role-bug.def b{color:var(--brick);}

  .pos-toggle{
    position:absolute; top:44px; right:10px;
    background:rgba(15,36,29,0.72);
    border:1px dashed var(--chalk-dim);
    color:var(--chalk-dim);
    padding:4px 9px;
    font-size:11px;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
  }
  .pos-toggle.on{ color:var(--gold); border-color:var(--gold); }

  .phase-callout{
    position:absolute; bottom:10px; left:10px; right:10px;
    font-family:'Kalam',cursive;
    font-size:17px;
    color:var(--chalk);
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
  }

  .panel{margin-top:14px;border-top:1px dashed var(--board-line);padding-top:14px;}
  .panel .prompt{font-size:15px;color:var(--chalk-dim);margin-bottom:10px;}
  .panel .prompt em{color:var(--chalk);font-style:normal;font-weight:500;}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media (max-width:520px){ .choice-grid{grid-template-columns:1fr;} }

  .choice-btn{
    background:transparent;
    border:1px solid var(--board-line);
    color:var(--chalk);
    padding:10px 12px;
    text-align:left;
    cursor:pointer;
    font-family:'Space Grotesk',sans-serif;
  }
  .choice-btn:hover{border-color:var(--gold);background:rgba(232,196,104,0.06);}
  .choice-btn .name{display:block;font-weight:700;font-size:14px;margin-bottom:4px;}
  .choice-btn .desc{display:block;font-size:12px;color:var(--chalk-dim);line-height:1.4;}
  .choice-btn.def:hover{border-color:var(--brick);background:rgba(193,80,63,0.08);}

  .waiting{
    text-align:center;
    padding:34px 16px;
    border:1px dashed var(--board-line);
  }
  .waiting .icon{font-size:24px;margin-bottom:10px;}
  .waiting p{font-size:14px;color:var(--chalk-dim);margin:0;}
  .pulse{ animation:pulseDot 1.4s ease-in-out infinite; }
  @keyframes pulseDot{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }

  button, .primary-btn{
    background:var(--gold);
    color:#1a1509;
    border:none;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 20px;
    cursor:pointer;
  }
  button:hover, .primary-btn:hover{background:#f3d488;}
  button.ghost{ background:transparent; color:var(--chalk); border:1px solid var(--board-line); }
  button.ghost:hover{ border-color:var(--gold); background:rgba(232,196,104,0.06); }

  .result-box{border:1px dashed var(--gold);padding:14px;}
  .result-box .yards{font-size:26px;font-weight:700;color:var(--gold);margin-bottom:4px;}
  .result-box .story{font-family:'Kalam',cursive;font-size:16px;color:var(--chalk);margin:6px 0 14px;}
  .result-box .td{color:var(--brick);font-weight:700;font-size:15px;margin-bottom:6px;}

  .footer-link{margin-top:18px;text-align:center;}
  .footer-link a{color:var(--chalk-dim);font-size:12px;cursor:pointer;text-decoration:underline;margin:0 8px;}
  .footer-link a:hover{color:var(--chalk);}

  .marker-pop{ transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.2,1.4,0.4,1); }

  @keyframes burstRing{
    0%   { r:3;  stroke-width:4; opacity:0.95; }
    100% { r:24; stroke-width:1; opacity:0; }
  }
  .tackle-burst{ animation: burstRing 0.55s ease-out forwards; }

  #panel.fading{ opacity:0; transition:none; }
  #panel{ transition: opacity 0.16s ease; }

  /* --- lobby --- */
  .lobby-card{ border:1px dashed var(--board-line); padding:22px 18px; text-align:center; }
  .lobby-card h2{ font-size:18px; margin:0 0 6px; }
  .lobby-card p.sub{ font-size:13px; color:var(--chalk-dim); margin:0 0 20px; }
  .role-pick{ display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
  .role-pick button{ flex:1; max-width:180px; }
  .code-display{
    font-family:'Space Grotesk',sans-serif;
    font-size:38px; font-weight:700; letter-spacing:6px;
    color:var(--gold);
    border:1px dashed var(--gold);
    padding:14px 10px;
    margin:16px 0;
    cursor:pointer;
  }
  .code-hint{ font-size:12px; color:var(--chalk-dim); margin-bottom:18px; }
  .code-input{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px; letter-spacing:6px; text-align:center; text-transform:uppercase;
    background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:10px; width:180px; margin:0 auto 16px; display:block;
  }
  .code-input:focus{ outline:none; border-color:var(--gold); }
  .lobby-error{ color:var(--brick); font-size:13px; margin-bottom:14px; min-height:16px; }
  .lobby-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .divider{ margin:22px 0; border-top:1px dashed var(--board-line); }

  /* --- editor --- */
  .ed-toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .seg-toggle{ display:flex; border:1px solid var(--board-line); }
  .seg-toggle button{ background:transparent; color:var(--chalk-dim); border:none; padding:8px 12px; font-size:13px; font-weight:500; cursor:pointer; }
  .seg-toggle button.active{ background:var(--gold); color:#1a1509; font-weight:700; }
  .seg-toggle button.active.def{ background:var(--brick); color:var(--chalk); }
  .ed-select, .ed-input{
    background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:8px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;
  }
  .ed-input{ flex:1; min-width:140px; }
  .cat-btn-row{ display:flex; gap:6px; margin-bottom:10px; }
  .cat-btn{ background:transparent; border:1px solid var(--board-line); color:var(--chalk-dim); padding:7px 12px; font-size:12px; cursor:pointer; }
  .cat-btn.active{ border-color:var(--gold); color:var(--gold); }
  .ed-canvas-wrap{ position:relative; width:100%; border:1px solid var(--board-line); background:var(--board); touch-action:none; }
  .ed-hint{ font-size:12px; color:var(--chalk-dim); margin:10px 0; line-height:1.5; }
  .ed-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .custom-pill{ font-size:10px; color:var(--gold); border:1px solid var(--gold-dim); padding:1px 5px; margin-left:4px; vertical-align:middle; }
  .cat-heading{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--chalk-dim); margin:14px 0 6px; }
  .cat-heading:first-of-type{ margin-top:0; }
  .create-new-btn{
    width:100%; margin-top:14px; background:transparent; color:var(--chalk-dim);
    border:1px dashed var(--board-line); padding:12px; font-family:'Space Grotesk',sans-serif;
    font-size:13px; cursor:pointer;
  }
  .create-new-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .ed-actions button.active-toggle{ border-color:var(--gold); color:var(--gold); }

  .typed-call-row{ display:flex; gap:8px; margin-bottom:14px; }
  .typed-call-row input{
    flex:1; background:transparent; border:1px solid var(--board-line); color:var(--chalk);
    padding:9px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;
  }
  .typed-call-row input:focus{ outline:none; border-color:var(--gold); }
  .typed-call-row button{
    background:var(--gold); color:#1a1509; border:none; font-weight:700; font-size:13px;
    padding:9px 14px; cursor:pointer; font-family:'Space Grotesk',sans-serif;
  }

  .coach-tip{
    border:1px dashed var(--gold-dim);
    padding:10px 12px;
    margin-bottom:14px;
    font-family:'Kalam',cursive;
    font-size:14px;
    color:var(--chalk);
  }
  .coach-tip.def{ border-color:var(--brick-dim); }
  .coach-tip .coach-label{
    font-family:'Space Grotesk',sans-serif; font-size:10px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--gold-dim); display:block; margin-bottom:4px;
  }
  .coach-tip.def .coach-label{ color:var(--brick-dim); }
</style>
</head>
<body>
<div class="app">

  <div class="masthead">
    <h1>Schemer</h1>
    <div class="tag" id="mastheadTag">a tactical trainer<br>play it out with a friend</div>
  </div>

  <div id="lobby"></div>

  <div id="gameArea" style="display:none;">
    <div class="field-wrap">
      <svg id="field" viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="down-bug" id="downBug"></div>
      <div class="role-bug" id="roleBug"></div>
      <button class="pos-toggle" id="posToggle" type="button">labels</button>
      <div class="phase-callout" id="phaseCallout"></div>
    </div>

    <div class="panel" id="panel"></div>

    <div class="footer-link">
      <a id="restartLink">restart the drive</a>
      <a id="leaveLink">leave</a>
    </div>
  </div>

</div>

function computeOutcome(g){
  const playObj = getPlay(g.offPlayKey, g.offPlayCustom);
  const callObj = getCall(g.defCallKey, g.defCallCustom);
  if(outcomes[g.offPlayKey] && outcomes[g.offPlayKey][g.defCallKey]){
    return outcomes[g.offPlayKey][g.defCallKey];
  }
  const base = categoryMatrix[playObj.category][callObj.category];
  const tierText = base<=2 ? "and it's snuffed out for almost nothing"
    : base<=5 ? "and picks up a modest gain"
    : base<=8 ? "and finds a healthy chunk of yardage"
    : "and breaks into the open for a big gain";
  return {
    yards: base,
    text: `${playObj.name} goes up against ${callObj.name} \u2014 ${tierText}.`,
    role: CALL_ROLE_BY_CATEGORY[callObj.category] || 'LB',
  };
}

/* ---- typed-in play/call calling ---- */

function normalizeCallText(s){ return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' '); }
function titleCaseCall(s){ return s.trim().replace(/\w\S*/g, w=> w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); }

function resolveTypedEntry(text, builtinDict, customList){
  const target = normalizeCallText(text);
  if(!target) return null;
  for(const k in builtinDict){ if(normalizeCallText(builtinDict[k].name)===target) return {type:'built', key:k}; }
  for(const item of customList){ if(normalizeCallText(item.name)===target) return {type:'custom', item}; }
  for(const k in builtinDict){
    const n = normalizeCallText(builtinDict[k].name);
    if(n.includes(target) || target.includes(n)) return {type:'built', key:k};
  }
  for(const item of customList){
    const n = normalizeCallText(item.name);
    if(n.includes(target) || target.includes(n)) return {type:'custom', item};
  }
  return null;
}

function guessOffCategory(text){
  const t = text.toLowerCase();
  if(/deep|bomb|go route|nine route|shot downfield|seam|streak|fly route|four verticals|four vertical/.test(t)) return 'deep';
  if(/play[\s-]?action|\bpa\b|boot|bootleg|fake/.test(t)) return 'playAction';
  if(/screen|quick|slant|fade|post|corner route|dig|out\b|comeback|curl/.test(t)) return 'pass';
  if(/run|sweep|draw|dive|power|counter|iso|zone read|option|toss|trap|reverse|misdirection/.test(t)) return 'run';
  return 'pass';
}
function guessDefCategory(text){
  const t = text.toLowerCase();
  if(/blitz|pressure|\bzero\b|dog|fire\s?zone|overload/.test(t)) return 'blitz';
  if(/cover|zone|buzz|cloud|robber|man|press|quarters|palms|match/.test(t)) return 'passD';
  if(/run|box|stack|contain|spy|gap/.test(t)) return 'runD';
  return 'passD';
}

const OFF_TYPED_DEFAULTS = { run:{xTarget:340,bend:0.3}, pass:{xTarget:460,bend:0.55}, playAction:{xTarget:390,bend:0.4}, deep:{xTarget:400,bend:0.25} };

async function handleTypedPlay(text, onPick, onPickCustom){
  const match = resolveTypedEntry(text, plays, customOffPlays);
  if(match){ match.type==='built' ? onPick(match.key) : onPickCustom(match.item); return; }
  const category = guessOffCategory(text);
  const d = OFF_TYPED_DEFAULTS[category];
  const item = { id: genId(), name: titleCaseCall(text), category, note:"Called on the fly.", xTarget:d.xTarget, bend:d.bend };
  customOffPlays = customOffPlays.filter(x=>x.id!==item.id);
  customOffPlays.push(item);
  await saveCustomList(CUSTOM_STORE_KEYS.offPlay, customOffPlays);
  onPickCustom(item);
}

async function handleTypedCall(text, onPick, onPickCustom){
  const match = resolveTypedEntry(text, calls, customDefCalls);
  if(match){ match.type==='built' ? onPick(match.key) : onPickCustom(match.item); return; }
  const category = guessDefCategory(text);
  const item = { id: genId(), name: titleCaseCall(text), category, note:"Called on the fly." };
  customDefCalls = customDefCalls.filter(x=>x.id!==item.id);
  customDefCalls.push(item);
  await saveCustomList(CUSTOM_STORE_KEYS.defCall, customDefCalls);
  onPickCustom(item);
}

/* ---- coach's recommendation, by down and distance ---- */

function offCoachTip(down, distance, ballOn){
  if(ballOn <= 10) return "Backed up near your own goal \u2014 keep it simple, avoid a disaster in the end zone.";
  if(ballOn >= 90) return "Red zone \u2014 the field's shrunk, high-percentage plays beat a low-odds home run here.";
  if(down === 4) return distance <= 2
    ? "Fourth and short \u2014 this is a power down, put it in your best hands."
    : "Fourth and long \u2014 you need a lot, but forcing a deep shot rarely ends well.";
  if(down === 3){
    if(distance <= 2) return "Third and short \u2014 stay on schedule, a safe run or quick throw does the job.";
    if(distance <= 6) return "Third and manageable \u2014 call something you trust to move the sticks.";
    return "Third and long \u2014 the defense expects a pass, but there's time to find a check-down first.";
  }
  if(down === 2){
    if(distance <= 3) return "Second and short \u2014 stay aggressive, another chunk sets up an easy third down.";
    if(distance <= 7) return "Second and medium \u2014 stay balanced, keep the defense guessing.";
    return "Second and long \u2014 start working your way back to a manageable third down.";
  }
  return "First down \u2014 fresh set of downs, establish whatever look you like.";
}

function defCoachTip(down, distance, ballOn){
  if(ballOn <= 10) return "They're backed up near their own goal \u2014 good spot to pin your ears back, a big loss here is huge.";
  if(ballOn >= 90) return "They're deep in the red zone \u2014 the field's shrunk, keep everything in front of you.";
  if(down === 4) return distance <= 2
    ? "Fourth and short \u2014 they're going for it, load the box."
    : "Fourth and long \u2014 they need a lot, make them earn it downfield.";
  if(down === 3){
    if(distance <= 2) return "Third and short \u2014 expect the run, but don't ignore a quick pass.";
    if(distance <= 6) return "Third and manageable \u2014 disguise the coverage, this is a passing down.";
    return "Third and long \u2014 rush the passer, a sack or incompletion ends the drive.";
  }
  if(down === 2){
    if(distance <= 3) return "Second and short \u2014 stay honest against the run.";
    if(distance <= 7) return "Second and medium \u2014 balanced call, don't overcommit either way.";
    return "Second and long \u2014 good spot to pressure, they're behind schedule.";
  }
  return "First down \u2014 read their formation, no need to guess yet.";
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function notConfiguredNotice(){
  alert("Online multiplayer needs a Firebase config \u2014 fill in the firebaseConfig object near the top of this file (see the comment above it for instructions).");
}

async function createRoom(role){
  if(!FIREBASE_CONFIGURED){ notConfiguredNotice(); return; }
  mode = 'online';
  roomCode = genCode();
  myRole = role;
  roomMeta = { offenseTaken: role==='offense', defenseTaken: role==='defense' };
  game = freshGame();
  try{ await roomRef(roomCode).set({meta:roomMeta, game}); } catch(e){ alert('Could not reach the multiplayer server: ' + e.message); return; }
  lsSetJSON(SESSION_KEY, {roomCode, role});
  appScreen = 'waiting';
  renderLobby();
  attachRoomListener();
}

function startLocalGame(){
  mode = 'local';
  myRole = null;
  roomCode = null;
  roomMeta = null;
  game = freshGame();
  enterGame();
}

async function joinRoom(codeRaw){
  if(!FIREBASE_CONFIGURED){ notConfiguredNotice(); return; }
  const code = codeRaw.toUpperCase().trim();
  if(code.length < 3){ showJoinError('Enter the room code your friend sent you.'); return; }
  let roomObj;
  try{ const snap = await roomRef(code).once('value'); roomObj = snap.val(); }
  catch(e){ showJoinError("Couldn't reach the multiplayer server \u2014 check your connection."); return; }
  if(!roomObj){ showJoinError("Couldn't find a room with that code."); return; }
  let role;
  if(!roomObj.meta.offenseTaken) role = 'offense';
  else if(!roomObj.meta.defenseTaken) role = 'defense';
  else { showJoinError('That room already has two players.'); return; }
  roomObj.meta[role+'Taken'] = true;
  await roomRef(code).set(roomObj);
  mode = 'online'; roomCode = code; myRole = role; roomMeta = roomObj.meta; game = roomObj.game;
  lsSetJSON(SESSION_KEY, {roomCode, role});
  enterGame();
}

function showJoinError(msg){
  const e = document.getElementById('lobbyError');
  if(e) e.textContent = msg;
}

async function tryResumeSession(){
  if(!FIREBASE_CONFIGURED) return false;
  const sess = lsGetJSON(SESSION_KEY);
  if(!sess) return false;
  let roomObj;
  try{ const snap = await roomRef(sess.roomCode).once('value'); roomObj = snap.val(); }
  catch(e){ return false; }
  if(!roomObj || !roomObj.meta[sess.role+'Taken']) return false;
  mode = 'online';
  roomCode = sess.roomCode; myRole = sess.role; roomMeta = roomObj.meta; game = roomObj.game;
  if(roomMeta.offenseTaken && roomMeta.defenseTaken){
    enterGame();
  } else {
    appScreen = 'waiting';
    renderLobby();
    attachRoomListener();
  }
  return true;
}

function leaveGame(){
  detachRoomListener();
  const wasLocal = mode === 'local';
  myRole = null; mode = null; roomCode = null; roomMeta = null; game = null; lastAnimatedSeq = -1;
  if(!wasLocal) lsSetJSON(SESSION_KEY, null);
  appScreen = 'landing';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('lobby').style.display = 'block';
  renderLobby();
}

let roomListenerRef = null;
function attachRoomListener(){
  detachRoomListener();
  if(!roomCode) return;
  roomListenerRef = roomRef(roomCode);
  roomListenerRef.on('value', snap=>{
    const roomObj = snap.val();
    if(!roomObj) return;
    roomMeta = roomObj.meta;
    if(appScreen === 'waiting'){
      if(roomMeta.offenseTaken && roomMeta.defenseTaken){ game = roomObj.game; enterGame(); }
      return;
    }
    if(appScreen === 'in-game'){
      if(!game || roomObj.game.seq !== game.seq){ game = roomObj.game; render(); }
    }
  });
}
function detachRoomListener(){ if(roomListenerRef){ roomListenerRef.off(); roomListenerRef = null; } }

async function writeGame(mutator){
  const copy = JSON.parse(JSON.stringify(game));
  mutator(copy);
  copy.seq = (game.seq||0) + 1;
  game = copy;
  render();
  if(mode === 'online'){
    try{ await roomRef(roomCode).set({meta:roomMeta, game}); } catch(e){ /* will retry on next action */ }
  }
}

function enterGame(){
  appScreen = 'in-game';
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('mastheadTag').innerHTML = mode === 'local'
    ? 'local 2-player'
    : 'room <b style="color:var(--gold)">'+roomCode+'</b>';
  drawStaticField();
  render();
}

/* ================= svg field (identical mechanics to the local build) ================= */

const PX_PER_YARD = 6.2;
const BASE_Y = 680;
function losY(ballOn){ return BASE_Y - (ballOn/100)*620; }

const svgNS = "http://www.w3.org/2000/svg";
const field = document.getElementById('field');

function el(name, attrs){
  const e = document.createElementNS(svgNS, name);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function drawStaticField(){
  field.innerHTML = '';
  field.appendChild(el('rect',{x:0,y:0,width:640,height:760,fill:'var(--board)'}));
  field.appendChild(el('rect',{x:0,y:0,width:640,height:60,fill:'var(--board-line)'}));
  field.appendChild(el('rect',{x:0,y:700,width:640,height:60,fill:'var(--board-line)'}));
  field.appendChild(el('line',{x1:40,y1:0,x2:40,y2:760,stroke:'var(--chalk-dim)','stroke-width':1.5}));
  field.appendChild(el('line',{x1:600,y1:0,x2:600,y2:760,stroke:'var(--chalk-dim)','stroke-width':1.5}));
  for(let y=10;y<100;y+=10){
    const yy = losY(y);
    field.appendChild(el('line',{x1:40,y1:yy,x2:600,y2:yy,stroke:'var(--hash)','stroke-width':1}));
    const label = Math.min(y,100-y);
    [90,550].forEach(lx=>{
      const t = el('text',{x:lx,y:yy+4,fill:'var(--hash)','font-size':13,'font-family':"'Space Grotesk',sans-serif",'text-anchor':'middle'});
      t.textContent = label;
      field.appendChild(t);
    });
  }
  for(let y=2;y<100;y+=2){
    const yy = losY(y);
    [260,380].forEach(hx=>{
      field.appendChild(el('line',{x1:hx,y1:yy,x2:hx+8,y2:yy,stroke:'var(--hash)','stroke-width':1}));
    });
  }
  field.appendChild(el('g',{id:'dynamic'}));
}

function clearDynamic(){ const dyn = document.getElementById('dynamic'); dyn.innerHTML=''; return dyn; }

function drawLineMarker(dyn, y, color, dashed){
  const attrs = {x1:40,y1:y,x2:600,y2:y,stroke:color,'stroke-width':2};
  if(dashed) attrs['stroke-dasharray'] = '6,5';
  dyn.appendChild(el('line', attrs));
}

function drawOffense(dyn, formKey, formCustom, ly, animate){
  const pts = offensePoints(formKey, formCustom);
  pts.forEach((p,i)=> dyn.appendChild(makeMarker(p.x, ly+p.y, i===2?'square':'X', 'var(--gold)', animate, i)));
}
function drawDefense(dyn, frontKey, frontCustom, ly, animate){
  const pts = defensePoints(frontKey, frontCustom);
  if(showPosLabels){
    const labels = computePositionLabels(pts);
    pts.forEach((p,i)=> dyn.appendChild(makeLabelMarker(p.x, ly+p.y, labels[i]||p.role||'?', 'var(--brick)', animate, i)));
  } else {
    pts.forEach((p,i)=> dyn.appendChild(makeMarker(p.x, ly+p.y, 'O', 'var(--brick)', animate, i)));
  }
}

function makeMarker(x,y,shape,color,animate,idx){
  const g = el('g',{});
  if(shape==='X'){ const s=7;
    g.appendChild(el('line',{x1:x-s,y1:y-s,x2:x+s,y2:y+s,stroke:color,'stroke-width':2}));
    g.appendChild(el('line',{x1:x-s,y1:y+s,x2:x+s,y2:y-s,stroke:color,'stroke-width':2}));
  } else if(shape==='square'){ const s=8;
    g.appendChild(el('rect',{x:x-s,y:y-s,width:s*2,height:s*2,fill:'none',stroke:color,'stroke-width':2}));
  } else {
    g.appendChild(el('circle',{cx:x,cy:y,r:9,fill:'none',stroke:color,'stroke-width':2}));
  }
  if(animate){
    g.classList.add('marker-pop');
    g.style.transformOrigin = x+'px '+y+'px';
    g.style.transformBox = 'fill-box';
    g.style.opacity = '0';
    g.style.transform = 'scale(0.2)';
    g.style.transitionDelay = (idx*22)+'ms';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ g.style.opacity='1'; g.style.transform='scale(1)'; }));
  }
  return g;
}

function makeLabelMarker(x,y,text,color,animate,idx){
  const g = el('g',{});
  const t = el('text',{x,y:y+4,'text-anchor':'middle','font-size':11,'font-family':"'Space Grotesk',sans-serif",'font-weight':700,fill:color});
  t.textContent = text;
  g.appendChild(t);
  if(animate){
    g.classList.add('marker-pop');
    g.style.transformOrigin = x+'px '+y+'px';
    g.style.transformBox = 'fill-box';
    g.style.opacity = '0';
    g.style.transform = 'scale(0.2)';
    g.style.transitionDelay = (idx*22)+'ms';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ g.style.opacity='1'; g.style.transform='scale(1)'; }));
  }
  return g;
}

function computePositionLabels(players){
  const labels = new Array(players.length).fill('');
  const byRole = {DL:[],LB:[],CB:[],S:[]};
  players.forEach((p,i)=>{ if(byRole[p.role]) byRole[p.role].push(i); });

  const dl = byRole.DL.slice().sort((a,b)=>players[a].x-players[b].x);
  if(dl.length===1) labels[dl[0]]='NT';
  else dl.forEach((idx,pos)=>{ labels[idx] = (pos===0||pos===dl.length-1) ? 'DE' : 'DT'; });

  const lb = byRole.LB.slice().sort((a,b)=>players[a].x-players[b].x);
  if(lb.length===1) labels[lb[0]]='MLB';
  else lb.forEach((idx,pos)=>{ labels[idx] = (pos===0||pos===lb.length-1) ? 'OLB' : 'MLB'; });

  const cb = byRole.CB.slice().sort((a,b)=> Math.abs(players[a].x-320)-Math.abs(players[b].x-320));
  cb.forEach((idx,pos)=>{ labels[idx] = pos < cb.length-2 ? 'NB' : 'CB'; });

  const s = byRole.S.slice().sort((a,b)=> players[a].y-players[b].y);
  s.forEach((idx,pos)=>{ labels[idx] = pos===0 ? 'FS' : 'SS'; });

  return labels;
}

function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }
function easeInCubic(t){ return t*t*t; }
function quadPoint(p0, c, p1, t){
  const mt = 1-t;
  return { x: mt*mt*p0.x + 2*mt*t*c.x + t*t*p1.x, y: mt*mt*p0.y + 2*mt*t*c.y + t*t*p1.y };
}
function setAttrs(el2,attrs){ for(const k in attrs) el2.setAttribute(k, attrs[k]); }

function drawPlayResult(dyn, ly, animate){
  const r = game.lastResult;
  const play = getPlay(game.offPlayKey, game.offPlayCustom);
  const startX = 320, startY = ly;
  const t = Math.min(r.yards/8,1);
  const finalX = startX + (play.xTarget - startX)*t;
  const finalY = ly - r.yards*PX_PER_YARD;

  const bend = play.bend;
  const control = {
    x: startX + (finalX - startX) * (0.35 + bend*0.35),
    y: startY - (startY - finalY) * (0.15 + (1-bend)*0.35),
  };
  const p0 = {x:startX,y:startY}, p1 = {x:finalX,y:finalY};

  const ball = makeMarker(startX, startY, 'X', 'var(--gold)', false, 0);
  const ballLines = ball.querySelectorAll('line');
  ballLines.forEach(l=> l.setAttribute('stroke-width', 3));
  const ballOffsets = Array.from(ballLines).map(l=>({
    x1:parseFloat(l.getAttribute('x1')), y1:parseFloat(l.getAttribute('y1')),
    x2:parseFloat(l.getAttribute('x2')), y2:parseFloat(l.getAttribute('y2')),
  }));
  dyn.appendChild(ball);

  const frPlayers = defensePoints(game.defFrontKey, game.defFrontCustom);
  const roleMatches = frPlayers.filter(p=>p.role===r.role);
  const pool = roleMatches.length ? roleMatches : frPlayers;
  let closest = pool[0], bestDist = Infinity;
  pool.forEach(p=>{ const d = Math.abs(p.x - finalX); if(d < bestDist){ bestDist = d; closest = p; } });
  const defStart = {x:closest.x, y: ly + closest.y};
  const defMarker = makeMarker(defStart.x, defStart.y, 'O', 'var(--brick)', false, 0);
  const defCircle = defMarker.querySelector('circle');
  defCircle.setAttribute('stroke-width', 3);
  dyn.appendChild(defMarker);

  if(!animate){
    const dx0 = finalX - startX, dy0 = finalY - startY;
    ballLines.forEach((l,i)=> setAttrs(l, {x1:ballOffsets[i].x1+dx0, y1:ballOffsets[i].y1+dy0, x2:ballOffsets[i].x2+dx0, y2:ballOffsets[i].y2+dy0}));
    defCircle.setAttribute('cx', finalX); defCircle.setAttribute('cy', finalY);
    return;
  }

  const DURATION = 850, DEF_DELAY = 120;
  const t0 = performance.now();
  function frame(now){
    const elapsed = now - t0;
    const ballT = Math.min(elapsed/DURATION, 1);
    const pos = quadPoint(p0, control, p1, easeOutCubic(ballT));
    const dx0 = pos.x - startX, dy0 = pos.y - startY;
    ballLines.forEach((l,i)=> setAttrs(l, {x1:ballOffsets[i].x1+dx0, y1:ballOffsets[i].y1+dy0, x2:ballOffsets[i].x2+dx0, y2:ballOffsets[i].y2+dy0}));

    const defElapsed = Math.max(0, elapsed - DEF_DELAY);
    const defT = Math.min(defElapsed/(DURATION - DEF_DELAY*0.6), 1);
    const defEase = easeInCubic(defT);
    const dcx = defStart.x + (finalX-defStart.x)*defEase, dcy = defStart.y + (finalY-defStart.y)*defEase;
    defCircle.setAttribute('cx', dcx); defCircle.setAttribute('cy', dcy);

    if(ballT < 1 || defT < 1){ requestAnimationFrame(frame); }
    else{
      const burst = el('circle',{cx:finalX,cy:finalY,r:3,fill:'none',stroke:'var(--chalk)'});
      burst.classList.add('tackle-burst');
      dyn.appendChild(burst);
      setTimeout(()=>{ renderPanel(); }, 220);
    }
  }
  requestAnimationFrame(frame);
}

function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }

/* ================= main render ================= */

function render(){
  if(!game) return;
  const ly = losY(game.ballOn);
  const dyn = clearDynamic();

  drawLineMarker(dyn, ly, 'var(--chalk)', false);
  if(game.ballOn < 100){
    const distY = losY(Math.min(game.ballOn+game.distance,100));
    drawLineMarker(dyn, distY, 'var(--gold)', true);
  }

  if(game.offKey) drawOffense(dyn, game.offKey, game.offCustom, ly, false);
  if(game.defFrontKey) drawDefense(dyn, game.defFrontKey, game.defFrontCustom, ly, false);

  let animateThisResult = false;
  if(game.lastResult && game.seq !== lastAnimatedSeq){
    animateThisResult = true;
    lastAnimatedSeq = game.seq;
  }
  if(game.lastResult){
    drawPlayResult(dyn, ly, animateThisResult);
  }

  document.getElementById('downBug').innerHTML =
    `<b>${ordinal(game.down)} &amp; ${game.distance}</b><br>ball on ${Math.round(game.ballOn)}`;
  const roleBug = document.getElementById('roleBug');
  if(mode === 'local'){
    roleBug.className = 'role-bug';
    roleBug.innerHTML = `<b>local 2-player</b>`;
  } else {
    roleBug.className = 'role-bug' + (myRole==='defense' ? ' def' : '');
    roleBug.innerHTML = `playing <b>${myRole==='offense'?'Offence':'Defence'}</b>`;
  }

  renderCallout(animateThisResult);
  if(animateThisResult){
    // hold off on the panel/result box until the animation finishes
    const p = document.getElementById('panel');
    p.style.opacity = '0';
    requestAnimationFrame(()=>{ p.innerHTML=''; p.appendChild(note('Watching it unfold\u2026')); requestAnimationFrame(()=>{ p.style.opacity='1'; }); });
  } else {
    renderPanel();
  }
}

function renderCallout(animating){
  const callout = document.getElementById('phaseCallout');
  if(animating){ callout.textContent = "Snap."; return; }

  if(mode === 'local'){
    const map = {
      OFF_FORMATION: "Offence, set your formation.",
      DEF_FRONT:     "Defence, match it.",
      HANDOFF_TO_OFF:"Hand the device to the offence.",
      OFF_PLAY:      "Offence, make the call.",
      HANDOFF_TO_DEF:"Hand the device to the defence.",
      DEF_CALL:      "Defence, make the call.",
      RESULT:        game.lastResult && game.lastResult.touchdown ? "Touchdown!" : "Here's the read.",
    };
    callout.textContent = map[game.phase] || '';
    return;
  }

  const mineTurn = isMyTurn();
  const map = {
    OFF_FORMATION: mineTurn ? "Set your formation." : "Offence is setting their formation.",
    DEF_FRONT:     mineTurn ? "Match their formation." : "Defence is matching the formation.",
    OFF_PLAY:      mineTurn ? "Make your play call." : "Offence is making the call.",
    DEF_CALL:      mineTurn ? "Make your defensive call." : "Defence is making the call.",
    RESULT:        game.lastResult && game.lastResult.touchdown ? "Touchdown!" : "Here's the read.",
  };
  callout.textContent = map[game.phase] || '';
}

function isMyTurn(){
  const phase = game.phase;
  if(phase==='OFF_FORMATION' || phase==='OFF_PLAY') return myRole==='offense';
  if(phase==='DEF_FRONT' || phase==='DEF_CALL') return myRole==='defense';
  return false;
}

/* ================= panel ================= */

const panel = document.getElementById('panel');

function renderPanel(){
  panel.style.opacity = '0';
  requestAnimationFrame(()=> buildPanel());
}

function buildPanel(){
  panel.innerHTML = '';
  const phase = game.phase;

  if(editorOverlay){
    panel.appendChild(renderInlineEditor());
    requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
    return;
  }

  if(mode === 'local'){
    buildLocalPanel(phase);
    requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
    return;
  }

  if(phase === 'OFF_FORMATION'){
    if(myRole==='offense'){
      panel.appendChild(choiceGrid(
        "Choose a formation \u2014 the defence will see it and line up across from you.", false,
        groupsByPersonnel(formations, customOffFormations, offPersonnelOf,
          k=>writeGame(g=>{ g.offKey=k; g.offCustom=null; g.phase='DEF_FRONT'; }),
          item=>writeGame(g=>{ g.offKey=CUSTOM; g.offCustom=item; g.phase='DEF_FRONT'; })),
        ()=> openEditor('offense','formation'), 'Create your own formation'
      ));
    } else {
      panel.appendChild(waitingBox("Offence is choosing a formation\u2026"));
    }
  } else if(phase === 'DEF_FRONT'){
    if(myRole==='defense'){
      panel.appendChild(choiceGrid(
        "Choose a front to match the offence's personnel.", true,
        groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
          k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='OFF_PLAY'; }),
          item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='OFF_PLAY'; })),
        ()=> openEditor('defense','formation'), 'Create your own front'
      ));
    } else {
      panel.appendChild(waitingBox("Defence is matching your formation\u2026"));
    }
  } else if(phase === 'OFF_PLAY'){
    if(myRole==='offense'){
      const onPick = k=>writeGame(g=>{ g.offPlayKey=k; g.offPlayCustom=null; g.phase='DEF_CALL'; });
      const onPickCustom = item=>writeGame(g=>{ g.offPlayKey=CUSTOM; g.offPlayCustom=item; g.phase='DEF_CALL'; });
      panel.appendChild(choiceGrid(
        "Hidden from the defence \u2014 pick your play.", false,
        groupsByCategory(plays, customOffPlays, PLAY_CATEGORIES, onPick, onPickCustom),
        ()=> openEditor('offense','play'), 'Create your own play',
        text=> handleTypedPlay(text, onPick, onPickCustom),
        offCoachTip(game.down, game.distance, game.ballOn)
      ));
    } else {
      panel.appendChild(waitingBox("Offence is making their play call\u2026"));
    }
  } else if(phase === 'DEF_CALL'){
    if(myRole==='defense'){
      const onPick = k=>writeGame(g=>{ g.defCallKey=k; g.defCallCustom=null; resolvePlay(g); g.phase='RESULT'; });
      const onPickCustom = item=>writeGame(g=>{ g.defCallKey=CUSTOM; g.defCallCustom=item; resolvePlay(g); g.phase='RESULT'; });
      panel.appendChild(choiceGrid(
        "Hidden from the offence \u2014 make your call.", true,
        groupsByCategory(calls, customDefCalls, CALL_CATEGORIES, onPick, onPickCustom),
        ()=> openEditor('defense','play'), 'Create your own call',
        text=> handleTypedCall(text, onPick, onPickCustom),
        defCoachTip(game.down, game.distance, game.ballOn)
      ));
    } else {
      panel.appendChild(waitingBox("Defence is making their call\u2026"));
    }
  } else if(phase === 'RESULT'){
    panel.appendChild(resultBox());
  }

  requestAnimationFrame(()=>{ panel.style.opacity = '1'; });
}

function buildLocalPanel(phase){
  if(phase === 'OFF_FORMATION'){
    panel.appendChild(choiceGrid(
      "Offence: choose a formation \u2014 the defence will see it and line up across from you.", false,
      groupsByPersonnel(formations, customOffFormations, offPersonnelOf,
        k=>writeGame(g=>{ g.offKey=k; g.offCustom=null; g.phase='DEF_FRONT'; }),
        item=>writeGame(g=>{ g.offKey=CUSTOM; g.offCustom=item; g.phase='DEF_FRONT'; })),
      ()=> openEditor('offense','formation'), 'Create your own formation'
    ));

  } else if(phase === 'DEF_FRONT'){
    panel.appendChild(choiceGrid(
      "Defence: choose a front to match the offence's personnel.", true,
      groupsByPersonnel(fronts, customDefFormations, defPersonnelOf,
        k=>writeGame(g=>{ g.defFrontKey=k; g.defFrontCustom=null; g.phase='HANDOFF_TO_OFF'; }),
        item=>writeGame(g=>{ g.defFrontKey=CUSTOM; g.defFrontCustom=item; g.phase='HANDOFF_TO_OFF'; })),
      ()=> openEditor('defense','formation'), 'Create your own front'
    ));

  } else if(phase === 'HANDOFF_TO_OFF'){
    panel.appendChild(handoffBox("Pass the device to the offence.", "Reveal play options", ()=>{
      writeGame(g=>{ g.phase='OFF_PLAY'; });
    }));

  } else if(phase === 'OFF_PLAY'){
    const onPickOff = k=>writeGame(g=>{ g.offPlayKey=k; g.offPlayCustom=null; g.phase='HANDOFF_TO_DEF'; });
    const onPickOffCustom = item=>writeGame(g=>{ g.offPlayKey=CUSTOM; g.offPlayCustom=item; g.phase='HANDOFF_TO_DEF'; });
    panel.appendChild(choiceGrid(
      "Hidden from the defence \u2014 pick your play.", false,
      groupsByCategory(plays, customOffPlays, PLAY_CATEGORIES, onPickOff, onPickOffCustom),
      ()=> openEditor('offense','play'), 'Create your own play',
      text=> handleTypedPlay(text, onPickOff, onPickOffCustom),
      offCoachTip(game.down, game.distance, game.ballOn)
    ));

  } else if(phase === 'HANDOFF_TO_DEF'){
    panel.appendChild(handoffBox("Pass the device to the defence.", "Reveal defensive calls", ()=>{
      writeGame(g=>{ g.phase='DEF_CALL'; });
    }));

  } else if(phase === 'DEF_CALL'){
    const onPickDef = k=>writeGame(g=>{ g.defCallKey=k; g.defCallCustom=null; resolvePlay(g); g.phase='RESULT'; });
    const onPickDefCustom = item=>writeGame(g=>{ g.defCallKey=CUSTOM; g.defCallCustom=item; resolvePlay(g); g.phase='RESULT'; });
    panel.appendChild(choiceGrid(
      "Hidden from the offence \u2014 make your call.", true,
      groupsByCategory(calls, customDefCalls, CALL_CATEGORIES, onPickDef, onPickDefCustom),
      ()=> openEditor('defense','play'), 'Create your own call',
      text=> handleTypedCall(text, onPickDef, onPickDefCustom),
      defCoachTip(game.down, game.distance, game.ballOn)
    ));

  } else if(phase === 'RESULT'){
    panel.appendChild(resultBox());
  }
}

  btn.onclick = onGo;
  wrap.appendChild(btn);

}

function computeOffPersonnel(skillArr){
  let backs=0, tes=0;
  skillArr.forEach(p=>{ if(p.label==='TE') tes++; else if(p.label==='RB'||p.label==='FB'||p.label==='HB') backs++; });
  return `${backs}${tes}`;
}
function offPersonnelOf(key, item, isCustom){
  return isCustom ? (item.personnel || '11') : computeOffPersonnel(item.skill);
}
function defPersonnelOf(key, item, isCustom){
  let dl=0, lb=0;
  item.players.forEach(p=>{ if(p.role==='DL') dl++; else if(p.role==='LB') lb++; });
  return `${dl}-${lb}`;
}

function groupsByCategory(builtinDict, customList, categoryMap, onPick, onPickCustom){
  return Object.keys(categoryMap).map(catKey=>{
    const entries=[];
    Object.keys(builtinDict).forEach(k=>{ if(builtinDict[k].category===catKey) entries.push({item:builtinDict[k],isCustom:false,onClick:()=>onPick(k)}); });
    (customList||[]).forEach(item=>{ if(item.category===catKey) entries.push({item,isCustom:true,onClick:()=>onPickCustom(item)}); });
    return {heading:categoryMap[catKey], entries};
  }).filter(g=>g.entries.length);
}

function groupsByPersonnel(builtinDict, customList, personnelFn, onPick, onPickCustom){
  const map = {};
  Object.keys(builtinDict).forEach(k=>{
    const label = personnelFn(k,builtinDict[k],false);
    (map[label] = map[label]||[]).push({item:builtinDict[k],isCustom:false,onClick:()=>onPick(k)});
  });
  (customList||[]).forEach(item=>{
    const label = personnelFn(item.id,item,true);
    (map[label] = map[label]||[]).push({item,isCustom:true,onClick:()=>onPickCustom(item)});
  });
  return Object.keys(map).sort().map(label=>({heading:label+' personnel', entries:map[label]}));
}

  if(typedHandler){
    const typedWrap = document.createElement('div'); typedWrap.className='typed-call-row';
    typedWrap.innerHTML = `<input class="ed-input" type="text" placeholder='Or type it in\u2026 e.g. "cover 3 buzz"' maxlength="40"><button type="button">Run it</button>`;
    const inp = typedWrap.querySelector('input');
    const btn = typedWrap.querySelector('button');

    btn.onclick = go;

      btn.onclick = e.onClick;

function resultBox(){
  const r = game.lastResult;
  const wrap = document.createElement('div'); wrap.className='result-box';
  if(r.touchdown) wrap.innerHTML += `<div class="td">TOUCHDOWN</div>`;
  wrap.innerHTML += `<div class="yards">${r.yards===0 ? 'No gain' : (r.yards+' yard'+(r.yards===1?'':'s'))}</div>`;
  wrap.innerHTML += `<div class="story">${r.text}</div>`;
  const meta = document.createElement('div'); meta.className='prompt';
  const formObj = getFormation(game.offKey, game.offCustom);
  const frontObj = getFront(game.defFrontKey, game.defFrontCustom);
  const playObj = getPlay(game.offPlayKey, game.offPlayCustom);
  const callObj = getCall(game.defCallKey, game.defCallCustom);
  meta.innerHTML = `<em>${formObj.name}</em> vs <em>${frontObj.name}</em> \u2014 ${playObj.name} into ${callObj.name}.`;
  wrap.appendChild(meta);
  const btn = document.createElement('button'); btn.className='primary-btn'; btn.style.marginTop='10px';
  btn.textContent = r.driveOver ? 'Start next drive' : 'Next play';
  btn.onclick = ()=>{
    writeGame(g=>{
      g.offKey=null; g.defFrontKey=null; g.offPlayKey=null; g.defCallKey=null; g.lastResult=null;
      g.offCustom=null; g.defFrontCustom=null; g.offPlayCustom=null; g.defCallCustom=null;
      g.phase='OFF_FORMATION';
    });
  };
  wrap.appendChild(btn);
  return wrap;
}

function resolvePlay(g){
  const o = computeOutcome(g);
  let yards = o.yards;
  let newBallOn = g.ballOn + yards;
  let touchdown = false, driveOver = false;

  if(newBallOn >= 100){
    touchdown = true; driveOver = true; newBallOn = 100;
  } else if(yards >= g.distance){
    g.down = 1; g.distance = Math.min(10, 100-newBallOn);
  } else {
    g.down += 1; g.distance -= yards;
    if(g.distance < 1) g.distance = 1;
    if(g.down > 4){ driveOver = true; newBallOn = 25; g.down = 1; g.distance = 10; }
  }
  g.ballOn = newBallOn;
  g.lastResult = { yards:o.yards, text:o.text, role:o.role, touchdown, driveOver };
  if(driveOver && !touchdown) g.lastResult.text += " Turnover on downs \u2014 fresh drive.";
}

const EDITOR_LOS_Y = 480;
let ed = { side:'offense', type:'formation', points:[], backdropKey:'singleback', arrowEnd:{x:380,y:EDITOR_LOS_Y-90}, category:'run', editingId:null };

function edInit(){
  ed = { side:'offense', type:'formation', points:[], backdropKey:'singleback',
    arrowEnd:{x:380,y:EDITOR_LOS_Y-90}, category:'run', personnel:'11', editingId:null };
  ed.points = edDefaultPoints('offense');
}

function edDefaultPoints(side){
  if(side==='offense') return offensePoints('singleback', null).map(p=>({x:p.x, y:EDITOR_LOS_Y+p.y}));
  return defensePoints('base43', null).map(p=>({x:p.x, y:EDITOR_LOS_Y+p.y, role:p.role}));
}

function roleForDepth(y){
  const upfield = EDITOR_LOS_Y - y;
  if(upfield < 20) return 'DL';
  if(upfield < 55) return 'LB';
  if(upfield < 85) return 'CB';
  return 'S';
}

function edSwitchSide(side){
  ed.side = side; ed.editingId = null;
  if(ed.type==='formation'){ ed.points = edDefaultPoints(side); ed.personnel='11'; }
  else { ed.category = side==='offense'?'run':'runD'; ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.backdropKey = side==='offense'?'singleback':'base43'; }
  renderEditorScreen();
}
function edSwitchType(type){
  ed.type = type; ed.editingId = null;
  if(type==='formation'){ ed.points = edDefaultPoints(ed.side); }
  else { ed.category = ed.side==='offense'?'run':'runD'; ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.backdropKey = ed.side==='offense'?'singleback':'base43'; }
  renderEditorScreen();
}
function edCategoryPick(cat){ ed.category = cat; renderEditorScreen(); }
function edBackdropChange(key){ ed.backdropKey = key; edRenderCanvas(); }

function edLoadExisting(value, inline){
  ed.editingId = null;
  const isOff = ed.side==='offense';
  const done = ()=> inline ? renderPanel() : renderEditorScreen();
  if(!value){
    if(ed.type==='formation'){ ed.points = edDefaultPoints(ed.side); ed.personnel='11'; }
    else { ed.arrowEnd={x:380,y:EDITOR_LOS_Y-90}; ed.category = isOff?'run':'runD'; }
    done(); return;
  }
  if(value.startsWith('built:')){
    const key = value.slice(6);
    if(ed.type==='formation'){
      if(isOff){
        ed.points = offensePoints(key,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}));
        ed.personnel = computeOffPersonnel(formations[key].skill);
      } else {
        ed.points = defensePoints(key,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      }
    } else {
      const src = isOff ? plays[key] : calls[key];
      ed.category = src.category;
      ed.arrowEnd = isOff ? { x:src.xTarget, y: EDITOR_LOS_Y - (src.bend*180+30) } : {x:380,y:EDITOR_LOS_Y-90};
    }
    done(); return;
  }
  const id = value.slice(7);
  if(ed.type==='formation'){
    const list = isOff?customOffFormations:customDefFormations;
    const item = list.find(x=>x.id===id);
    if(item){
      ed.editingId=id; ed.points = item.players.map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      if(isOff) ed.personnel = item.personnel || '11';
    }
  } else {
    const list = isOff?customOffPlays:customDefCalls;
    const item = list.find(x=>x.id===id);
    if(item){
      ed.editingId=id; ed.category=item.category;
      ed.arrowEnd = isOff ? { x:item.xTarget, y: EDITOR_LOS_Y - (item.bend*180+30) } : (item.arrowEnd || {x:380,y:EDITOR_LOS_Y-90});
    }
  }
  done();
}

function edFlip(){
  if(ed.type==='formation'){ ed.points = ed.points.map(p=> ({...p, x: 640-p.x})); }
  else { ed.arrowEnd = {...ed.arrowEnd, x: 640-ed.arrowEnd.x}; }
  edRenderCanvas();
}

const PERSONNEL_OPTIONS = ['00','01','02','10','11','12','13','20','21','22','23','31','32'];
function personnelSelectHtml(selected){
  return '<select class="ed-select" id="edPersonnel">' +
    PERSONNEL_OPTIONS.map(o=>`<option value="${o}" ${selected===o?'selected':''}>${o} personnel</option>`).join('') +
    '</select>';
}

async function edPersist(){
  const nameInput = document.getElementById('edName');
  const name = (nameInput && nameInput.value.trim()) || 'Untitled';
  const isOff = ed.side==='offense';
  if(ed.type==='formation'){
    const players = ed.points.map(p=> isOff
      ? {x:Math.round(p.x), y:Math.round(p.y-EDITOR_LOS_Y)}
      : {x:Math.round(p.x), y:Math.round(p.y-EDITOR_LOS_Y), role: roleForDepth(p.y)});
    const item = { id: ed.editingId || genId(), name, players };
    if(isOff){
      const personnelInput = document.getElementById('edPersonnel');
      item.personnel = (personnelInput && personnelInput.value) || '11';
    }
    const key = isOff ? CUSTOM_STORE_KEYS.offForm : CUSTOM_STORE_KEYS.defForm;
    let list = (isOff ? customOffFormations : customDefFormations).filter(x=>x.id!==item.id);
    list.push(item);
    if(isOff) customOffFormations = list; else customDefFormations = list;
    await saveCustomList(key, list);
  } else if(isOff){
    const dx = ed.arrowEnd.x - 320;
    const bend = Math.max(0.1, Math.min(0.9, Math.abs(dx)/300));
    const item = { id: ed.editingId || genId(), name, category: ed.category,
      note: "A play you designed.", xTarget: Math.round(ed.arrowEnd.x), bend };
    let list = customOffPlays.filter(x=>x.id!==item.id); list.push(item);
    customOffPlays = list;
    await saveCustomList(CUSTOM_STORE_KEYS.offPlay, list);
  } else {
    const item = { id: ed.editingId || genId(), name, category: ed.category,
      note: "A call you designed.", arrowEnd: {x:Math.round(ed.arrowEnd.x), y:Math.round(ed.arrowEnd.y)} };
    let list = customDefCalls.filter(x=>x.id!==item.id); list.push(item);
    customDefCalls = list;
    await saveCustomList(CUSTOM_STORE_KEYS.defCall, list);
  }
}

async function edPersistDelete(){
  if(!ed.editingId) return;
  const isOff = ed.side==='offense';
  if(ed.type==='formation'){
    if(isOff){ customOffFormations = customOffFormations.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.offForm, customOffFormations); }
    else { customDefFormations = customDefFormations.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.defForm, customDefFormations); }
  } else if(isOff){
    customOffPlays = customOffPlays.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.offPlay, customOffPlays);
  } else {
    customDefCalls = customDefCalls.filter(x=>x.id!==ed.editingId); await saveCustomList(CUSTOM_STORE_KEYS.defCall, customDefCalls);
  }
}

      <div class="seg-toggle" id="sideToggle">
        <button data-side="offense" class="${isOff?'active':''}">Offence</button>
        <button data-side="defense" class="${!isOff?'active def':''}">Defence</button>
      </div>
      <div class="seg-toggle" id="typeToggle">
        <button data-type="formation" class="${ed.type==='formation'?'active':''}">Formation</button>
        <button data-type="play" class="${ed.type==='play'?'active':''}">${isOff?'Play':'Call'}</button>
      </div>
    </div>
    <div class="ed-toolbar">
      <select class="ed-select" id="edExisting">${existingOptionsHtml}</select>
      ${ed.type==='play' ? `<select class="ed-select" id="edBackdrop">${backdropOptionsHtml}</select>` : ''}
      ${ed.type==='formation' && isOff ? personnelSelectHtml(ed.personnel) : ''}
      <input class="ed-input" id="edName" placeholder="Name it\u2026" maxlength="40" value="${existingName}">
    </div>
    ${catButtonsHtml}
    <div class="ed-canvas-wrap"><svg id="edSvg" viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <p class="ed-hint">${ed.type==='formation'
      ? 'Drag any player to reposition them \u2014 this becomes your custom ' + (isOff?'formation.':'front.')
      : 'Drag from the ball to draw where it goes \u2014 that\u2019s what the ' + (isOff?'play':'call') + ' does. The backdrop players are just for reference.'}</p>
    <div class="ed-actions">
      <button id="edFlipBtn" class="ghost">Flip</button>
      ${!isOff ? `<button id="edLabelsBtn" class="ghost${showPosLabels?' active-toggle':''}">Position labels</button>` : ''}
      <button id="edSaveBtn">Save</button>
      ${ed.editingId ? '<button id="edDeleteBtn" class="ghost">Delete</button>' : ''}
      <button id="edBackBtn" class="ghost">Back</button>
    </div>
  `;
  lobby.appendChild(c);

  document.querySelectorAll('#sideToggle button').forEach(b=> b.onclick = ()=> edSwitchSide(b.dataset.side));
  document.querySelectorAll('#typeToggle button').forEach(b=> b.onclick = ()=> edSwitchType(b.dataset.type));
  document.getElementById('edExisting').onchange = e=> edLoadExisting(e.target.value);
  if(ed.type==='play') document.getElementById('edBackdrop').onchange = e=> edBackdropChange(e.target.value);
  document.querySelectorAll('.cat-btn').forEach(b=> b.onclick = ()=> edCategoryPick(b.dataset.cat));
  document.getElementById('edFlipBtn').onclick = edFlip;
  if(document.getElementById('edLabelsBtn')) document.getElementById('edLabelsBtn').onclick = ()=>{ showPosLabels=!showPosLabels; refreshCurrentView(); };
  document.getElementById('edSaveBtn').onclick = edSave;
  if(document.getElementById('edDeleteBtn')) document.getElementById('edDeleteBtn').onclick = edDelete;
  document.getElementById('edBackBtn').onclick = ()=>{ appScreen='landing'; renderLobby(); };

  edRenderCanvas();
}

function edSvgPoint(evt, svg){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if(!ctm) return {x:320,y:400};
  const loc = pt.matrixTransform(ctm.inverse());
  return { x: Math.max(45,Math.min(595,loc.x)), y: Math.max(15,Math.min(745,loc.y)) };
}

function edStartDragPoint(evt, i, svg){
  evt.preventDefault();
  const startP = edSvgPoint(evt, svg);
  const orig = ed.points[i];
  const offX = orig.x - startP.x, offY = orig.y - startP.y;
  const move = e=>{
    const p = edSvgPoint(e, svg);
    const nx = p.x+offX, ny = p.y+offY;
    ed.points[i] = ed.side==='defense'
      ? {...ed.points[i], x:nx, y:ny, role: roleForDepth(ny)}
      : {...ed.points[i], x:nx, y:ny};
    edRenderCanvas();
  };
  const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function edStartDragArrow(evt, svg){
  evt.preventDefault();
  const move = e=>{ ed.arrowEnd = edSvgPoint(e, svg); edRenderCanvas(); };
  const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

function edDraggableMarker(svg, x, y, shape, color, labelText, onDown){
  const g = el('g',{});
  const visual = labelText ? makeLabelMarker(x, y, labelText, color, false, 0) : makeMarker(x, y, shape, color, false, 0);
  visual.style.pointerEvents = 'none';
  g.appendChild(visual);
  const hit = el('circle',{cx:x,cy:y,r:17,fill:'transparent'});
  hit.style.cursor='grab';
  hit.addEventListener('pointerdown', onDown);
  g.appendChild(hit);
  return g;
}

function edRenderCanvas(){
  const svg = document.getElementById('edSvg');
  if(!svg) return;
  svg.innerHTML = '';
  svg.appendChild(el('rect',{x:0,y:0,width:640,height:760,fill:'var(--board)'}));
  svg.appendChild(el('line',{x1:40,y1:EDITOR_LOS_Y,x2:600,y2:EDITOR_LOS_Y,stroke:'var(--chalk-dim)','stroke-width':1,'stroke-dasharray':'4,4'}));
  const isOff = ed.side==='offense';

  if(ed.type==='formation'){
    const labels = (!isOff && showPosLabels) ? computePositionLabels(ed.points) : null;
    ed.points.forEach((p,i)=>{
      const shape = isOff ? (i===2 ? 'square' : 'X') : 'O';
      const color = isOff ? 'var(--gold)' : 'var(--brick)';
      svg.appendChild(edDraggableMarker(svg, p.x, p.y, shape, color, labels?labels[i]:null, e=> edStartDragPoint(e, i, svg)));
    });
  } else {
    let backdropPts = [];
    try{
      if(String(ed.backdropKey).startsWith('custom:')){
        const id = ed.backdropKey.slice(7);
        const list = isOff?customOffFormations:customDefFormations;
        const item = list.find(x=>x.id===id);
        if(item) backdropPts = item.players.map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      } else {
        backdropPts = isOff ? offensePoints(ed.backdropKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y}))
                             : defensePoints(ed.backdropKey,null).map(p=>({x:p.x,y:EDITOR_LOS_Y+p.y,role:p.role}));
      }
    }catch(e){ backdropPts = []; }
    const backdropLabels = (!isOff && showPosLabels) ? computePositionLabels(backdropPts) : null;
    backdropPts.forEach((p,i)=>{
      if(backdropLabels){
        const g = makeLabelMarker(p.x,p.y, backdropLabels[i]||'?', 'var(--brick-dim)', false, 0);
        g.style.opacity='0.55';
        svg.appendChild(g);
        return;
      }
      const shape = isOff ? (i===2 ? 'square' : 'X') : 'O';
      const g = makeMarker(p.x,p.y, shape, isOff?'var(--gold-dim)':'var(--brick-dim)', false, 0);
      g.style.opacity='0.55';
      svg.appendChild(g);
    });

    const ballX=320, ballY=EDITOR_LOS_Y;
    const ballColor = isOff ? 'var(--gold)' : 'var(--brick)';
    svg.appendChild(el('line',{x1:ballX,y1:ballY,x2:ed.arrowEnd.x,y2:ed.arrowEnd.y,stroke:ballColor,'stroke-width':3}));
    const ang = Math.atan2(ed.arrowEnd.y-ballY, ed.arrowEnd.x-ballX);
    const ah = 10;
    svg.appendChild(el('line',{x1:ed.arrowEnd.x,y1:ed.arrowEnd.y,x2:ed.arrowEnd.x-ah*Math.cos(ang-0.4),y2:ed.arrowEnd.y-ah*Math.sin(ang-0.4),stroke:ballColor,'stroke-width':3}));
    svg.appendChild(el('line',{x1:ed.arrowEnd.x,y1:ed.arrowEnd.y,x2:ed.arrowEnd.x-ah*Math.cos(ang+0.4),y2:ed.arrowEnd.y-ah*Math.sin(ang+0.4),stroke:ballColor,'stroke-width':3}));

    svg.appendChild(el('circle',{cx:ballX,cy:ballY,r:10,fill:ballColor,stroke:'var(--chalk)','stroke-width':1.5}));
    svg.appendChild(el('circle',{cx:ed.arrowEnd.x,cy:ed.arrowEnd.y,r:8,fill:'none',stroke:ballColor,'stroke-width':2}));
    const endHit = el('circle',{cx:ed.arrowEnd.x,cy:ed.arrowEnd.y,r:17,fill:'transparent'});
    endHit.style.cursor='grab';
    endHit.addEventListener('pointerdown', e=> edStartDragArrow(e, svg));
    svg.appendChild(endHit);
  }
}

/* ================= wire up footer + boot ================= */

document.getElementById('restartLink').onclick = ()=>{
  writeGame(g=>{
    Object.assign(g, freshGame());
  });
};
document.getElementById('leaveLink').onclick = leaveGame;
document.getElementById('posToggle').onclick = ()=>{
  showPosLabels = !showPosLabels;
  document.getElementById('posToggle').classList.toggle('on', showPosLabels);
  refreshCurrentView();
};

(async function boot(){
  await loadAllCustom();
  const resumed = await tryResumeSession();
  if(!resumed){ appScreen = 'landing'; renderLobby(); }
})();
</script>
